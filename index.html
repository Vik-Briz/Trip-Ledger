<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>Trip Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFE8D8;
    --paper-dark:#E4DAC0;
    --paper-darker:#D8CBA9;
    --ink:#2A2A22;
    --ink-soft:#6b6a58;
    --pine:#1F4B3F;
    --pine-deep:#123128;
    --pine-tint:#DCE7DF;
    --rust:#C1622B;
    --rust-tint:#F3DFCC;
    --brass:#9C7F32;
    --danger:#9C3B2E;
    --danger-tint:#F2DAD3;
    --line:#C9BFA3;
    --line-soft:#DDD3B6;
    --shadow: 0 2px 0 rgba(42,42,34,0.08);
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 8% 0%, rgba(31,75,63,0.06), transparent 40%),
      var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:.04em;
    font-weight:600;
    color:var(--pine-deep);
    margin:0;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  #app{max-width:1080px;margin:0 auto;padding:20px 18px 80px;}

  /* ---------- Trip tag header ---------- */
  .tag{
    position:relative;
    background:var(--pine);
    color:#F4EFE0;
    border-radius:10px;
    padding:22px 26px 20px 44px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:18px;
    justify-content:space-between;
    background-image:
      radial-gradient(circle at 18px 50%, var(--paper) 7px, rgba(0,0,0,0) 7.5px),
      repeating-linear-gradient(0deg, rgba(244,239,224,0.14) 0 1px, transparent 1px 9px);
    background-position: 0 0, 0 0;
    border:1.5px dashed rgba(244,239,224,0.35);
    box-shadow: 0 6px 0 rgba(18,49,40,0.25);
  }
  .tag::before{
    content:"";
    position:absolute;
    left:11px; top:50%; transform:translateY(-50%);
    width:14px;height:14px;border-radius:50%;
    border:2px solid var(--pine);
    background:var(--paper);
  }
  .tag .tag-left{display:flex; align-items:center; gap:14px; min-width:0;}
  .header-identity{
    position:absolute; top:10px; right:14px;
    display:flex; align-items:center; gap:8px;
    font-size:11px; color:#DDD6C1;
    background:rgba(18,49,40,0.35);
    border:1px solid rgba(244,239,224,0.25);
    border-radius:16px;
    padding:4px 10px;
    z-index:2;
  }
  .header-identity b{color:#F4EFE0;}
  .tag .glyph{
    font-size:28px; line-height:1;
    filter:drop-shadow(0 1px 0 rgba(0,0,0,0.25));
  }
  .cover-thumb{
    width:56px; height:56px; border-radius:8px; flex:none;
    background:rgba(244,239,224,0.12); border:1.5px solid rgba(244,239,224,0.35);
    display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative;
  }
  .cover-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .cover-edit-badge{
    position:absolute; right:-4px; bottom:-4px; background:var(--rust); border-radius:50%;
    width:20px; height:20px; display:flex; align-items:center; justify-content:center; font-size:10px;
    border:2px solid var(--pine);
  }
  .loc-line{margin-top:4px; font-size:11.5px;}
  .loc-line a{color:#F4EFE0; text-decoration:underline; text-decoration-color:rgba(244,239,224,0.5);}
  .loc-add{cursor:pointer; opacity:.75; text-decoration:underline dotted;}
  .loc-edit{cursor:pointer; opacity:.65; margin-left:8px; text-decoration:underline dotted; font-size:10.5px;}
  .backend-chip{font-size:10px; letter-spacing:.03em;}
  .backend-chip.ok{color:var(--pine);}
  .backend-chip.warn{color:var(--rust);}
  .access-badge{
    display:inline-block; font-family:'Oswald',sans-serif; font-size:10px; letter-spacing:.05em; text-transform:uppercase;
    padding:3px 10px; border-radius:12px; border:1px solid var(--line);
  }
  .access-badge.developer{background:var(--rust-tint); color:var(--rust); border-color:#e0b28c; font-weight:600;}
  .access-badge.admin{background:var(--pine-tint); color:var(--pine-deep); border-color:#a9c6b8;}
  .access-badge.member{background:var(--paper-dark); color:var(--ink-soft);}
  .tag .titles{min-width:0;}
  .tag h1{font-size:22px; color:#F4EFE0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:46vw;}
  .tag .sub{font-size:11px; letter-spacing:.12em; text-transform:uppercase; opacity:.75; margin-top:3px;}
  .tag .stats{display:flex; gap:10px; flex-wrap:wrap;}
  .stat-chip{
    background:rgba(244,239,224,0.12);
    border:1px solid rgba(244,239,224,0.3);
    border-radius:20px;
    padding:6px 14px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    display:flex; flex-direction:column; align-items:center; gap:1px;
    min-width:78px;
  }
  .stat-chip b{font-size:14px;}
  .stat-chip span{font-size:9px; letter-spacing:.08em; text-transform:uppercase; opacity:.7;}
  .stat-chip.warn{background:rgba(193,98,43,0.25); border-color:rgba(193,98,43,0.55);}
  .stat-chip.ok{background:rgba(70,130,100,0.25); border-color:rgba(70,130,100,0.5);}

  .switcher{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  select, button, input, textarea{
    font-family:'Work Sans', sans-serif;
    font-size:13px;
  }
  .btn{
    appearance:none; border:1px solid var(--pine); background:var(--pine); color:#F4EFE0;
    padding:8px 14px; border-radius:4px; cursor:pointer; font-weight:600; letter-spacing:.02em;
    box-shadow: var(--shadow);
  }
  .btn:hover{background:var(--pine-deep);}
  .btn.ghost{background:transparent; color:var(--pine); border:1px solid var(--pine);}
  .btn.ghost:hover{background:var(--pine-tint);}
  .btn.rust{background:var(--rust); border-color:var(--rust);}
  .btn.rust:hover{background:#a4501f;}
  .btn.sm{padding:5px 10px; font-size:12px;}
  .btn.icon{padding:6px 9px; line-height:1;}
  select.trip-select{
    background:var(--paper); border:1px solid var(--line); border-radius:4px; padding:7px 10px;
    color:var(--ink); font-weight:500; max-width:220px;
  }

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex; gap:2px; margin-top:18px; border-bottom:2px solid var(--pine-deep);
    overflow-x:auto;
  }
  .tab{
    padding:10px 16px; cursor:pointer; white-space:nowrap;
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.05em; font-size:12.5px;
    color:var(--ink-soft); background:var(--paper-dark); border:1px solid var(--line-soft); border-bottom:none;
    border-radius:6px 6px 0 0; position:relative; top:2px;
  }
  .tab.active{
    color:#F4EFE0; background:var(--pine-deep); border-color:var(--pine-deep);
  }

  .panel{
    background:#F7F2E6; border:1px solid var(--line); border-top:none;
    border-radius:0 0 8px 8px; padding:22px;
    box-shadow: var(--shadow);
  }
  .panel-section + .panel-section{margin-top:26px; padding-top:22px; border-top:1px dashed var(--line);}
  .panel-page-title{
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-size:20px;
    color:var(--pine-deep); font-weight:700; margin-bottom:18px; padding-bottom:12px; border-bottom:2px solid var(--pine);
  }
  .section-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap;}
  .section-head h2{font-size:16px;}
  .section-note{font-size:11.5px; color:var(--ink-soft); font-style:italic; margin-top:-6px; margin-bottom:14px;}

  table{width:100%; border-collapse:collapse;}
  .wide-col{width:26%; min-width:170px;}
  .check-col{width:34px; text-align:center; padding-left:4px; padding-right:4px;}
  .check-col input[type=checkbox]{width:16px; height:16px; cursor:pointer;}
  tr.purchased-row .item-name{text-decoration:line-through; opacity:0.55;}
  tr.purchased-row td{opacity:0.75;}
  th{
    text-align:left; font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-soft); border-bottom:2px solid var(--line); padding:8px 8px;
  }
  td{padding:6px 8px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
  tr.subtotal td{background:var(--paper-dark); font-weight:600; font-family:'IBM Plex Mono',monospace;}
  tr.grandtotal td{background:var(--pine-tint); font-weight:700; font-family:'IBM Plex Mono',monospace; border-top:2px solid var(--pine);}
  tr.group-head td{
    background:var(--pine-deep); color:#F4EFE0; font-family:'Oswald',sans-serif; text-transform:uppercase;
    letter-spacing:.05em; font-size:12px; padding-top:8px; padding-bottom:8px;
  }
  .group-head-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .group-add-btn{
    background:transparent; color:#F4EFE0; border-color:rgba(244,239,224,0.5);
    text-transform:none; letter-spacing:normal; font-size:11px; padding:4px 10px;
  }
  .group-add-btn:hover{background:rgba(244,239,224,0.15);}
  td input[type=text], td input[type=number], td select{
    width:100%; border:1px solid transparent; background:transparent; padding:5px 6px; border-radius:3px;
    color:var(--ink); font-size:13px;
  }
  td input:hover, td select:hover{border-color:var(--line);}
  td input:focus, td select:focus{border-color:var(--pine); outline:none; background:#fff;}
  .num{font-family:'IBM Plex Mono',monospace; text-align:right;}
  .num input{text-align:right;}
  .money-input-wrap{
    display:block; width:100%; text-align:right; white-space:nowrap;
  }
  .money-input-wrap .currency-prefix{
    color:var(--ink-soft); font-size:12px; margin-right:1px;
  }
  .money-input-wrap input[type=number]{
    width:7em; text-align:right; padding-left:2px; display:inline-block; vertical-align:middle;
  }
  .neg{color:var(--danger);}
  .pos{color:var(--pine);}
  .row-actions{width:34px; text-align:center;}
  .del{background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:15px; padding:2px 6px; border-radius:3px;}
  .del:hover{color:var(--danger); background:var(--danger-tint);}
  .catch-day-date{font-size:9px; font-weight:400; text-transform:none; letter-spacing:0; color:var(--rust); font-family:'IBM Plex Mono',monospace; margin-top:2px;}
  .catch-cell{max-width:56px; text-align:center;}
  .role-abbr-badge{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:11px;
    background:var(--pine-tint); color:var(--pine-deep); border-radius:4px; padding:2px 7px;
  }
  .person-role{max-width:52px; text-align:center; font-family:'IBM Plex Mono',monospace; font-weight:600;}

  .addrow{margin-top:10px;}

  .banner{
    border-radius:8px; padding:16px 18px; display:flex; align-items:center; justify-content:space-between;
    gap:16px; flex-wrap:wrap; margin-top:18px;
  }
  .banner.ok{background:var(--pine-tint); border:1px solid #a9c6b8;}
  .banner.warn{background:var(--danger-tint); border:1px solid #d9b2a8;}
  .banner .big{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600;}
  .banner .label{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.05em; font-size:12px; color:var(--ink-soft);}

  .toggle-group{display:flex; border:1px solid var(--pine); border-radius:20px; overflow:hidden;}
  .toggle-group button{
    border:none; background:var(--paper); color:var(--pine); padding:6px 14px; cursor:pointer;
    font-family:'Oswald',sans-serif; font-size:11.5px; letter-spacing:.05em; text-transform:uppercase;
  }
  .toggle-group button.active{background:var(--pine); color:#F4EFE0;}

  .empty{
    text-align:center; padding:36px 20px; color:var(--ink-soft); font-style:italic;
    border:1.5px dashed var(--line); border-radius:8px;
  }

  .loading-screen{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:80px 20px; text-align:center;
  }
  .loading-spinner{
    width:36px; height:36px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--rust);
    animation:spin 0.8s linear infinite;
  }
  .loading-msg{
    font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:.04em; text-transform:uppercase;
    color:var(--ink-soft);
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .day-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px;}
  .day-card{
    background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:14px;
    position:relative;
  }
  .day-card .day-title{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;
  }
  .day-card .day-title input{
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-size:14px;
    border:none; background:transparent; color:var(--pine-deep); font-weight:600; padding:2px 0; width:70%;
  }
  .day-date-formatted{
    font-size:11px; color:var(--rust); font-weight:600; font-family:'Oswald',sans-serif;
    letter-spacing:.03em; text-transform:uppercase; margin:-6px 0 10px;
  }
  .trip-start-row{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;
    background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:10px 14px;
  }
  .trip-start-row label{
    font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-family:'Oswald',sans-serif;
  }
  .trip-start-row input[type=date]{
    border:1px solid var(--line); border-radius:4px; padding:5px 8px; font-size:12px;
    font-family:'IBM Plex Mono',monospace; background:#fff; color:var(--ink);
  }
  .trip-date-range{
    font-size:12px; color:var(--pine-deep); font-weight:600; margin-left:auto;
  }
  .balance-forward-row{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:10px 14px;
  }
  .balance-forward-row .balance-forward-label{
    flex:1; min-width:160px; border:1px solid var(--line); border-radius:4px; padding:6px 8px;
    font-size:12.5px; background:#fff;
  }
  .balance-forward-row .money-input-wrap{
    flex:none; width:110px; border:1px solid var(--line); border-radius:4px; padding:6px 8px; background:#fff;
    font-family:'IBM Plex Mono',monospace; font-size:13px;
  }
  .meal-row{margin-bottom:8px;}
  .meal-row label{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-family:'Oswald',sans-serif;}
  .meal-row textarea{
    width:100%; border:1px solid var(--line); border-radius:4px; padding:6px 8px; resize:vertical; min-height:34px;
    font-family:'Work Sans',sans-serif; font-size:12.5px; margin-top:3px; background:#fff;
  }

  .day-title-text{
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-size:14px;
    color:var(--pine-deep); font-weight:600;
  }
  .activity-list{display:flex; flex-direction:column; gap:10px;}
  .activity-card{
    background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:8px;
    display:flex; flex-direction:column; gap:6px;
  }
  .activity-top-row{display:flex; align-items:center; gap:6px;}
  .activity-type{
    border:1px solid var(--line); border-radius:4px; padding:4px 6px; font-size:12px;
    background:#fff; flex:none; max-width:130px;
  }
  .activity-reorder{display:flex; gap:2px; margin-left:auto;}
  .activity-reorder .btn{padding:2px 7px; font-size:10px; line-height:1.4;}
  .activity-reorder .btn:disabled{opacity:0.3; cursor:default;}
  .activity-top-row .activity-del{flex:none;}
  .activity-time-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .activity-time-row .activity-time, .activity-time-row .activity-endtime{
    border:1px solid var(--line); border-radius:4px; padding:5px 6px; font-size:11.5px;
    font-family:'IBM Plex Mono',monospace; background:#fff; flex:none; width:88px;
  }
  .activity-time-sep{color:var(--ink-soft); font-size:11px;}
  .activity-time-row .activity-title{
    flex:1; min-width:140px; border:1px solid var(--line); border-radius:4px; padding:5px 8px;
    font-size:12.5px; background:#fff;
  }
  .activity-loc-row{display:flex; align-items:center; gap:6px;}
  .activity-location{
    flex:1; border:1px solid var(--line); border-radius:4px; padding:5px 8px;
    font-size:11.5px; background:#fff;
  }
  .activity-map-link{
    flex:none; text-decoration:none; font-size:15px; padding:3px 6px; border:1px solid var(--line);
    border-radius:4px; background:#fff;
  }
  .activity-notes{
    border:1px solid var(--line); border-radius:4px; padding:5px 8px;
    font-size:11.5px; font-family:'Work Sans',sans-serif; background:#fff; resize:vertical; min-height:28px;
  }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(18,49,40,0.45); display:flex; align-items:center; justify-content:center;
    z-index:50; padding:20px;
  }
  .modal{
    background:var(--paper); border-radius:10px; padding:24px; width:100%; max-width:420px;
    border:1px solid var(--line); box-shadow:0 10px 30px rgba(0,0,0,0.25);
  }
  .modal h2{margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:5px; font-family:'Oswald',sans-serif;}
  .field input[type=text], .field select{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:4px; background:#fff;
  }
  .type-pick{display:flex; gap:8px;}
  .type-pick button{
    flex:1; padding:14px 8px; border:1.5px solid var(--line); background:#fff; border-radius:8px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px; font-family:'Oswald',sans-serif; font-size:11px;
    text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft);
  }
  .type-pick button .g{font-size:22px;}
  .type-pick button.active{border-color:var(--pine); background:var(--pine-tint); color:var(--pine-deep);}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}

  .footer-note{margin-top:26px; text-align:center; font-size:11px; color:var(--ink-soft); font-style:italic;}

  @media (max-width:640px), (max-height:520px) and (orientation:landscape){
    html, body{ overflow-x:hidden; } /* hard safety net against any element pushing the page wider than the screen */

    .tag{
      padding:16px 16px 16px 34px;
      flex-direction:column;
      align-items:stretch;
      gap:12px;
      overflow:hidden;
    }
    /* Grid (not flex) for the photo+text row — grid's 1fr track reliably
       shrinks long text to fit, which nested flexbox is notoriously
       unreliable at even with min-width:0 set throughout the chain. */
    .tag .tag-left{
      display:grid;
      grid-template-columns:56px minmax(0,1fr);
      align-items:center;
      gap:14px;
      width:100%;
      min-width:0;
    }
    .tag .titles{ min-width:0; overflow:hidden; }
    .tag h1{
      max-width:100%;
      font-size:18px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .tag .sub, .loc-line{
      overflow-wrap:break-word;
      white-space:normal;
    }
    .stat-chip{min-width:64px; padding:5px 10px;}
    .header-identity{
      position:static;
      justify-content:flex-end;
      font-size:10px; flex-wrap:wrap; row-gap:4px;
      order:-1;
      max-width:100%;
    }

    #app{padding:14px 8px 60px;}
    .panel{padding:14px 8px;}
    .tab{padding:9px 10px; font-size:11px;}

    /* Wide tables (Shopping List, People, Costs, Overview) scroll
       sideways within their own contained box — the page itself still
       only scrolls up/down. Swiping *inside* a table scrolls the table;
       swiping anywhere else on the page switches tabs (see the touch
       handler in the script, which explicitly ignores touches that start
       inside .table-scroll so the two gestures don't fight each other). */
    .table-scroll{
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      margin:0 -8px;
      padding:0 8px;
    }
    .table-scroll table{ min-width:600px; }
    .table-scroll table td, .table-scroll table th{ white-space:nowrap; }
    .table-scroll table td input, .table-scroll table td select{ min-width:70px; }
    .table-scroll table td.row-actions{ min-width:34px; }
    .scroll-hint{ display:block; }

    /* Meal Plan days stack vertically too — no side-to-side swiping
       inside the page, that gesture is reserved for switching tabs. */
    .day-grid{
      display:block;
    }
    .day-grid .day-card{
      max-width:100%;

<script>
/* ============================= Storage helpers ============================= */
/* Personal (per-device) data uses plain localStorage — this file is meant to be
   opened as a real, standalone page (from Drive, email, wherever), not inside
   the Claude.ai artifact sandbox, so localStorage works normally here. */
const LS_BACKEND_URL_KEY = 'tripledger.backendUrl';

function lsGet(key){
  try{ const v = localStorage.getItem(key); return v===null ? null : JSON.parse(v); }
  catch(e){ return null; }
}
function lsSet(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch(e){ console.error('localStorage set failed', e); return false; }
}

/* Shared (cross-device) data goes to a Google Apps Script Web App backed by a
   Google Sheet (+ Drive for photos) that you deploy yourself — see SETUP.md. */
function getBackendUrl(){ return localStorage.getItem(LS_BACKEND_URL_KEY) || ''; }
function setBackendUrl(url){ localStorage.setItem(LS_BACKEND_URL_KEY, url.trim()); }

// Every backend call gets a hard timeout — without this, a slow Apps Script
// cold-start or a flaky connection can leave a fetch() pending forever, with
// no error and no way to recover except reloading the page.
const BACKEND_TIMEOUT_MS = 20000;
function fetchWithTimeout(url, opts){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), BACKEND_TIMEOUT_MS);
  return fetch(url, {...(opts||{}), signal: controller.signal}).finally(()=>clearTimeout(timer));
}

async function backendGet(key){
  const url = getBackendUrl();
  if(!url) return {ok:false, error:'no-backend'};
  try{
    const res = await fetchWithTimeout(url + '?action=get&key=' + encodeURIComponent(key), {method:'GET'});
    const data = await res.json();
    return data.ok ? {ok:true, value: data.value} : {ok:false, error: data.error||'unknown'};
  }catch(e){
    return {ok:false, error: e.name==='AbortError' ? 'timed out — the backend took too long to respond' : String(e)};
  }
}
async function backendSet(key, valueStr){
  const url = getBackendUrl();
  if(!url) return {ok:false, error:'no-backend'};
  try{
    const res = await fetchWithTimeout(url, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // avoids a CORS preflight against Apps Script
      body: JSON.stringify({action:'set', key, value: valueStr}),
    });
    const data = await res.json();
    return data.ok ? {ok:true} : {ok:false, error:data.error||'unknown'};
  }catch(e){
    return {ok:false, error: e.name==='AbortError' ? 'timed out — the backend took too long to respond' : String(e)};
  }
}
async function backendUploadPhoto(tripId, dataUrl){
  const url = getBackendUrl();
  if(!url) return {ok:false, error:'no-backend'};
  try{
    const res = await fetchWithTimeout(url, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'uploadPhoto', tripId, dataUrl}),
    });
    const data = await res.json();
    return data.ok ? {ok:true, url:data.url} : {ok:false, error:data.error||'unknown'};
  }catch(e){
    return {ok:false, error: e.name==='AbortError' ? 'timed out — the backend took too long to respond' : String(e)};
  }
}

// Unified interface matching the app's original calling convention:
// storeGet(key, shared) / storeSet(key, value, shared)
async function storeGet(key, shared){
  if(!shared) return lsGet(key);
  const r = await backendGet(key);
  if(!r.ok){ setBackendStatus(r.error==='no-backend' ? 'unconfigured' : 'error'); return null; }
  setBackendStatus('ok');
  return (r.value===null || r.value===undefined || r.value==='') ? null : JSON.parse(r.value);
}
async function storeSet(key, value, shared){
  if(!shared){ return lsSet(key, value); }
  const r = await backendSet(key, JSON.stringify(value));
  setBackendStatus(r.ok ? 'ok' : (r.error==='no-backend' ? 'unconfigured' : 'error'));
  return r.ok;
}

let backendStatus = 'unknown'; // 'unknown' | 'unconfigured' | 'ok' | 'error'
function setBackendStatus(s){
  if(backendStatus === s) return;
  backendStatus = s;
  renderBackendChip();
}
function renderBackendChip(){
  const el = document.getElementById('backendChip');
  if(!el) return;
  const map = {
    unknown: {text:'', cls:''},
    unconfigured: {text:'⚙ Backend not connected', cls:'warn'},
    ok: {text:'● Synced', cls:'ok'},
    error: {text:'⚠ Sync error — check backend', cls:'warn'},
  };
  const m = map[backendStatus] || map.unknown;
  el.textContent = m.text;
  el.className = 'backend-chip ' + m.cls;
}

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function money(n){ n = Number(n)||0; return '$' + n.toLocaleString(undefined,{minimumFractionDigits:0, maximumFractionDigits:0}); }
function money2(n){ n = Number(n)||0; return '$' + n.toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}); }
// A $-prefixed number input — used for every editable budget/actual/paid/amount
// field so the currency symbol is always visible, and every figure shows 2
// decimal places, matching how the read-only "Actual" column already looks.
function moneyField(cls, value, extraAttrs){
  const v = (Math.round((Number(value)||0) * 100) / 100).toFixed(2);
  const attrs = extraAttrs || '';
  const stepAttr = /\bstep=/.test(attrs) ? '' : 'step="0.01"';
  return `<span class="money-input-wrap"><span class="currency-prefix">$</span><input type="number" class="${cls}" value="${v}" ${stepAttr} ${attrs}></span>`;
}

// after that, the directory lives in shared storage and is managed entirely
// through the "Manage Access" screen, not by editing this file.
const DEFAULT_USER_DIRECTORY = [
  {name:'Vikash Deo', level:'developer'},
  {name:'Gavin Ponusamy', level:'admin'},
  {name:'Neville Reddy', level:'admin'},
];
const ACCESS_LEVELS = {
  developer: {label:'Developer', rank:2},
  admin:     {label:'Admin', rank:1},
  member:    {label:'Member', rank:0},
};
const TAB_ORDER = ['overview','people','costs','meals','itinerary','shopping'];

/* ============================= App state ============================= */
const state = {
  tripsIndex: [],   // [{id,name,type,createdAt}]
  trip: null,       // current full trip object
  tab: 'overview',
  shoppingView: 'category',
  showNewTripModal: false,
  showImportModal: false,
  showManageAccessModal: false,
  showInviteModal: false,
  showSwitchModal: false,
  loaded: false,
  identity: null,     // {name, phone}
  userDirectory: [],  // [{name, level: 'developer'|'admin'|'member'}] — shared across ALL trips
};

// ADMIN: can edit trip content (Admin or Developer). DEVELOPER: can additionally
// manage who has access at all (add people, promote/demote levels). Both are
// recomputed from state.userDirectory + state.identity, never hardcoded.
let ADMIN = false;
let DEVELOPER = false;
let ACCESS_LEVEL = 'member';

function accessLevelForName(name){
  const key = String(name||'').trim().toLowerCase();
  if(!key) return 'member';
  const entry = state.userDirectory.find(u=>String(u.name||'').trim().toLowerCase()===key);
  return entry ? entry.level : 'member';
}
function computeAdmin(){
  ACCESS_LEVEL = state.identity ? accessLevelForName(state.identity.name) : 'member';
  DEVELOPER = ACCESS_LEVEL === 'developer';
  ADMIN = ACCESS_LEVEL === 'developer' || ACCESS_LEVEL === 'admin';
  return ADMIN;
}
// Kept for the Members table's per-person Access badge — now reflects the
// real directory (and Developer) instead of a hardcoded admin-only check.
function isAdminName(name){
  const lvl = accessLevelForName(name);
  return lvl === 'admin' || lvl === 'developer';
}

async function loadUserDirectory(){
  const dir = await storeGet('user-directory', true);
  if(Array.isArray(dir) && dir.length){
    state.userDirectory = dir;
  } else {
    // First time this backend has ever been used — seed and persist the default.
    state.userDirectory = DEFAULT_USER_DIRECTORY.map(u=>({...u}));
    await storeSet('user-directory', state.userDirectory, true);
  }
}
function countDevelopers(){
  return state.userDirectory.filter(u=>u.level==='developer').length;
}
function saveUserDirectory(){
  storeSet('user-directory', state.userDirectory, true);
}

  if(!t.location) t.location = {name:'', mapsUrl:''};
  if(t.startDate === undefined) t.startDate = '';
  if(!t.catchLog) t.catchLog = {};
  if(t.catchLogEnabled === undefined) t.catchLogEnabled = false;
  if(Array.isArray(t.shopping)) t.shopping.forEach(i=>{ if(i.purchased===undefined) i.purchased=false; });
  if(!Array.isArray(t.activities)) t.activities = [];
  t.activities.forEach((a,i)=>{
    if(a.type===undefined) a.type = 'activity';
    if(a.endTime===undefined) a.endTime = '';
    if(!a.location) a.location = {name:'', mapsUrl:''};
    if(a.order===undefined) a.order = i;
  });
  if(!t.balanceForward) t.balanceForward = {label:'Balance FW', amount:0};
  return t;
}

function activitiesForDay(t, dayId){
  return t.activities
    .filter(a=>a.dayId===dayId)
    .slice()
    .sort((a,b)=> (a.order||0) - (b.order||0));
}
function moveActivity(t, id, direction){
  // direction: -1 (up) or 1 (down) — swaps order with the neighbour in the same day
  const a = findActivity(t, id);
  if(!a) return;
  const siblings = activitiesForDay(t, a.dayId);
  const idx = siblings.findIndex(x=>x.id===id);
  const swapIdx = idx + direction;
  if(swapIdx < 0 || swapIdx >= siblings.length) return;
  const b = siblings[swapIdx];
  const tmp = a.order; a.order = b.order; b.order = tmp;
}


function getCatch(t, personId, dayId){
  return (t.catchLog[personId] && Number(t.catchLog[personId][dayId])) || 0;
}
function setCatch(t, personId, dayId, value){
  if(!t.catchLog[personId]) t.catchLog[personId] = {};
  t.catchLog[personId][dayId] = Number(value)||0;
}
function catchTotalForPerson(t, personId){
  return t.days.reduce((sum,d)=>sum + getCatch(t,personId,d.id), 0);
}
function catchTotalForDay(t, dayId){
  return t.people.reduce((sum,p)=>sum + getCatch(t,p.id,dayId), 0);
}
function catchGrandTotal(t){
  return t.people.reduce((sum,p)=>sum + catchTotalForPerson(t,p.id), 0);
}

/* A day's date is always derived from the trip's start date + its position
   in the list — no per-day date field to keep in sync. */
function toISODateLocal(d){
  // Manual YYYY-MM-DD using LOCAL date parts — d.toISOString() converts to
  // UTC first, which silently shifts the date back a day for any timezone
  // ahead of UTC (e.g. Australia). This avoids that entirely.
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function dayDateFor(trip, index){
  if(!trip.startDate) return '';
  const d = new Date(trip.startDate + 'T00:00:00');
  if(isNaN(d.getTime())) return '';
  d.setDate(d.getDate() + index);
  return toISODateLocal(d);
}
function tripEndDate(trip){
  if(!trip.startDate || !trip.days.length) return '';
  return dayDateFor(trip, trip.days.length - 1);
}

/* ============================= Derived calculations ============================= */
function groupShopping(trip, key){
  const groups = {};
  trip.shopping.forEach(item=>{
    const g = (item[key] && item[key].trim()) ? item[key].trim() : (key==='store' ? 'Store TBD' : 'Uncategorised');
    if(!groups[g]) groups[g] = {label:g, items:[], budget:0, actual:0};
    const qty = Number(item.qty)||0;
    const unit = Number(item.unitActual)||0;
    const budget = Number(item.budget)||0;
    const actual = qty * unit;
    groups[g].items.push(item);
    groups[g].budget += budget;
    groups[g].actual += actual;
  });
  return Object.values(groups);
}

function shoppingTotals(trip){
  let budget=0, actual=0;
  trip.shopping.forEach(item=>{
    budget += Number(item.budget)||0;
    actual += (Number(item.qty)||0) * (Number(item.unitActual)||0);
  });
  return {budget, actual};
}

function costLinesTotals(trip){
  let budget=0, actual=0;
  trip.costs.forEach(c=>{ budget += Number(c.budget)||0; actual += Number(c.actual)||0; });
  return {budget, actual};
}

function grandTotals(trip){
  const c = costLinesTotals(trip);
  const s = shoppingTotals(trip);
  return {budget: c.budget + s.budget, actual: c.actual + s.actual};
}

function collectedTotal(trip){
  const fromPeople = trip.people.reduce((sum,p)=> sum + (Number(p.paid)||0), 0);
  const forward = (trip.balanceForward && Number(trip.balanceForward.amount)) || 0;
  return fromPeople + forward;
}

function owedFor(trip, person){
  const role = trip.roles.find(r=>r.id===person.roleId);
  return role ? Number(role.amount)||0 : 0;
}

// Short 1-2 letter code per role for compact display — e.g. "Vehicle
// user" -> V, "Passenger" -> P. Falls back to two letters if the first
// letter is already taken by another role.
function roleAbbreviations(roles){
  const used = {};
  const map = {};
  roles.forEach(r=>{
    const label = (r.label||'?').trim();
    let abbr = (label.charAt(0) || '?').toUpperCase();
    if(used[abbr] && used[abbr] !== r.id){
      abbr = label.slice(0,2).toUpperCase() || abbr;
    }
    used[abbr] = r.id;
    map[r.id] = abbr;
  });
  return map;
}

/* ============================= Persistence ============================= */
let saveTimer = null;
let sizeWarned = false;
function scheduleSave(){
  if(!ADMIN || !state.trip) return;
  clearTimeout(saveTimer);
  const tripSnapshot = state.trip; // capture NOW — if the user switches trips before
                                    // the timer fires, we must still save THIS trip's
                                    // edit to THIS trip's id, not whatever trip is
                                    // active when the timer happens to go off.
  saveTimer = setTimeout(()=>{
    const size = JSON.stringify(tripSnapshot).length;
    if(size > 45000){
      if(!sizeWarned){
        sizeWarned = true;
        alert('This trip\u2019s data is getting close to the Google Sheets cell size limit (45k+ characters). Consider trimming the shopping list or splitting into another trip \u2014 further changes may fail to save.');
      }
    } else {
      sizeWarned = false;
    }
    storeSet('trip:'+tripSnapshot.id, tripSnapshot, true);
  }, 250);
}

/* ============================= Swipe-to-switch-tabs ============================= */
/* Attached once to #app itself (never replaced by render(), only its
   innerHTML is), so this survives every re-render. Horizontal swipes move
   between tabs; anything that isn't a clean, mostly-horizontal, fast-enough
   gesture is ignored so normal vertical scrolling and text selection still
   work as expected. */
function setupSwipeNav(){
  const app = document.getElementById('app');
  let startX = 0, startY = 0, startTime = 0, active = false;
  const SWIPE_MIN_DISTANCE = 60;   // px
  const SWIPE_MAX_OFF_AXIS = 70;   // px of vertical drift still counts as "horizontal"
  const SWIPE_MAX_TIME = 700;      // ms

  app.addEventListener('touchstart', e=>{
    if(e.touches.length !== 1) { active = false; return; }
    const tag = (e.target.tagName||'').toLowerCase();
    if(tag === 'input' || tag === 'textarea' || tag === 'select'){ active = false; return; }
    if(e.target.closest('.table-scroll')){ active = false; return; } // let the table handle its own sideways scroll
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY; startTime = Date.now();
    active = true;
  }, {passive:true});

  app.addEventListener('touchend', e=>{
    if(!active || !state.trip) return;
    active = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    const dt = Date.now() - startTime;
    if(dt > SWIPE_MAX_TIME) return;
    if(Math.abs(dy) > SWIPE_MAX_OFF_AXIS) return;
    if(Math.abs(dx) < SWIPE_MIN_DISTANCE) return;
    swipeToTab(dx < 0 ? 1 : -1);
  }, {passive:true});
}
function swipeToTab(direction){
  const idx = TAB_ORDER.indexOf(state.tab);
  const next = idx + direction;
  if(next < 0 || next >= TAB_ORDER.length) return;
  state.tab = TAB_ORDER[next];
  state.showNewTripModal = false;
  state.showImportModal = false;
  render();
}

setupSwipeNav();
// If someone arrived via a scanned QR code (see the Invite feature), the
// backend URL is baked into the link as ?b=... — connect automatically so
// they land straight on the "what's your name?" screen instead of having
// to paste the backend URL themselves.
function autoConnectFromUrlParam(){
  const params = new URLSearchParams(window.location.search);
  const b = params.get('b');
  if(b && !getBackendUrl()){
    try{
      setBackendUrl(decodeURIComponent(b));
      // Clean the URL so the backend link isn't left sitting in the
      // address bar / browser history for anyone who looks over a shoulder.
      const cleanUrl = window.location.pathname + window.location.hash;
      window.history.replaceState({}, '', cleanUrl);
    }catch(e){ /* malformed param — fall through to the normal connect screen */ }
  }
}

async function init(){
  autoConnectFromUrlParam();
  if(!getBackendUrl()){
    state.loaded = true;
    render();
    return;
  }
  state.identity = await loadIdentity();
  if(!state.identity){
    state.loaded = true;
    render();
    return;
  }
  await loadUserDirectory();

  await loadTripsAndTrip();
}

async function loadTripsAndTrip(){
  showLoading('Loading your trip…');
  const lastId = await storeGet('last-trip-id', false); // local, instant

  let idx, tripToLoad = null;
  if(lastId){
    // We already know which trip we probably want — fetch the index and
    // that trip in parallel instead of waiting on the index first.
    const [idxResult, tripResult] = await Promise.all([
      storeGet('trips-index', true),
      storeGet('trip:'+lastId, true),
    ]);
    idx = idxResult;
    state.tripsIndex = idx || [];
    if(state.tripsIndex.find(x=>x.id===lastId)) tripToLoad = tripResult;
  } else {
    idx = await storeGet('trips-index', true);
    state.tripsIndex = idx || [];
  }

  if(!tripToLoad && state.tripsIndex.length){
    tripToLoad = await storeGet('trip:'+state.tripsIndex[0].id, true);
  }
  if(!tripToLoad){
    if(ADMIN) state.showNewTripModal = true;
  } else {
    state.trip = ensureTripShape(tripToLoad);
  }
  state.loaded = true;
  render();
}

function showLoading(msg){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="loading-screen">
      <div class="loading-spinner"></div>
      <div class="loading-msg">${escapeHtml(msg||'Loading…')}</div>
    </div>
  `;
}

async function selectTrip(id){
  if(actionInProgress) return;
  actionInProgress = true;
  try{
    showLoading('Switching trip…');
    const t = await storeGet('trip:'+id, true);
    if(t){
      state.trip = ensureTripShape(t);
      state.tab = 'overview';
      storeSet('last-trip-id', id, false);
    }
    render();
  } finally {
    actionInProgress = false;
  }
}

// Prevents the exact "screen freezes" bug: these buttons live in a modal
// that's separate from the page content underneath, so they don't visually
// disable themselves while a network call is in flight — without this guard,
// an impatient double-tap fires the action twice, which not only creates a
// duplicate but makes the real wait even longer (two round-trips instead of one).
let actionInProgress = false;

async function createTrip(name, type){
  if(!ADMIN || actionInProgress) return;
  actionInProgress = true;
  try{
    showLoading('Creating trip…');
    const t = newTrip(name, type);
    state.tripsIndex.push({id:t.id, name:t.name, type:t.type, createdAt:t.createdAt});
    await Promise.all([
      storeSet('trips-index', state.tripsIndex, true),
      storeSet('trip:'+t.id, t, true),
    ]);
    storeSet('last-trip-id', t.id, false); // local, instant — no need to await
    state.trip = t;
    state.tab = 'overview';
    state.showNewTripModal = false;
    render();
  } finally {
    actionInProgress = false;
  }
}

async function duplicateTrip(){
  if(!ADMIN || !state.trip || actionInProgress) return;
  const src = state.trip;
  const name = prompt('Name for the new trip:', src.name + ' (Copy)');
  if(!name || !name.trim()) return;
  actionInProgress = true;
  try{
    showLoading('Duplicating trip…');

    // Remap role and day IDs so the copy doesn't share references with the
    // original — everything that points at a role or day needs the NEW id.
    const roleIdMap = {};
    const newRoles = src.roles.map(r=>{
      const newId = uid();
      roleIdMap[r.id] = newId;
      return {...r, id:newId};
    });
    const dayIdMap = {};
    const newDays = src.days.map(d=>{
      const newId = uid();
      dayIdMap[d.id] = newId;
      return {...d, id:newId};
    });

    const newTripObj = {
      id: uid(),
      name: name.trim(),
      type: src.type,
      createdAt: Date.now(),
      photo: src.photo,
      location: {...src.location},
      startDate: src.startDate,
      costs: src.costs.map(c=>({...c, id:uid(), actual:0})),          // budgets copied, actual spend reset
      roles: newRoles,
      people: src.people.map(p=>({...p, id:uid(), roleId: roleIdMap[p.roleId]||'', paid:0})), // who's coming copied, payments reset
      days: newDays,                                                   // meal plan copied as-is
      shopping: src.shopping.map(s=>({...s, id:uid(), unitActual:0, purchased:false})), // list copied, shopping progress reset
      catchLog: {},                                                    // catch counts are per-trip, start fresh
      catchLogEnabled: !!src.catchLogEnabled,                          // the on/off preference carries over, the data doesn't
      activities: src.activities.map(a=>({...a, id:uid(), dayId: dayIdMap[a.dayId]||'', location:{...(a.location||{name:'',mapsUrl:''})}})),
      balanceForward: {label:'Balance FW', amount:0}, // rollover credit is specific to the trip it came from — starts fresh
    };

    state.tripsIndex.push({id:newTripObj.id, name:newTripObj.name, type:newTripObj.type, createdAt:newTripObj.createdAt});
    await Promise.all([
      storeSet('trips-index', state.tripsIndex, true),
      storeSet('trip:'+newTripObj.id, newTripObj, true),
    ]);
    storeSet('last-trip-id', newTripObj.id, false);
    state.trip = newTripObj;
    state.tab = 'overview';
    render();
  } finally {
    actionInProgress = false;
  }
}

async function deleteCurrentTrip(){
  if(!ADMIN || !state.trip) return;
  if(!confirm('Delete "'+state.trip.name+'"? This cannot be undone.')) return;
  const id = state.trip.id;
  state.tripsIndex = state.tripsIndex.filter(t=>t.id!==id);
  await storeSet('trips-index', state.tripsIndex, true);
  if(state.tripsIndex.length){
    await selectTrip(state.tripsIndex[0].id);
  } else {
    state.trip = null;
    state.showNewTripModal = true;
    render();
  }
}

/* ---------- Cover photo ---------- */
function handlePhotoUpload(e, t){
  if(!ADMIN) return;
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ alert('Please choose an image file.'); return; }
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = async function(){
      const MAX_DIM = 1000;
      let w = img.width, h = img.height;
      if(w > h && w > MAX_DIM){ h = Math.round(h * MAX_DIM / w); w = MAX_DIM; }
      else if(h > MAX_DIM){ w = Math.round(w * MAX_DIM / h); h = MAX_DIM; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.75);

      const thumb = document.getElementById('coverThumb');
      if(thumb) thumb.style.opacity = '0.5';
      const result = await backendUploadPhoto(t.id, dataUrl);
      if(thumb) thumb.style.opacity = '1';
      if(!result.ok){
        alert('Photo upload failed (' + result.error + '). Check the backend connection and try again.');
        return;
      }
      t.photo = result.url;
      scheduleSave();
      render();
    };
    img.onerror = function(){ alert('Could not read that image — try a different file.'); };
    img.src = ev.target.result;
  };
  reader.onerror = function(){ alert('Could not read that file.'); };
  reader.readAsDataURL(file);
}

/* ---------- Location ---------- */
function editLocation(t){
  if(!ADMIN) return;
  const name = prompt('Trip location (place name or address):', (t.location && t.location.name) || '');
  if(name === null) return; // cancelled
  if(!t.location) t.location = {name:'', mapsUrl:''};
  t.location.name = name.trim();

    t.location.mapsUrl = '';
  } else {
    const link = prompt('Optional: paste a specific Google Maps link (leave blank to auto-search by name):', t.location.mapsUrl || '');
    t.location.mapsUrl = (link || '').trim();
  }
  scheduleSave();
  render();
}

/* ---------- Overview ---------- */

  const catGroups = groupShopping(t, 'category');

  t.costs.forEach(c=>{

    rows += `<tr>

    <div class="panel-section">
      <div class="section-head"><h2>Budget vs Actual</h2></div>
      <div class="section-note">Pulled from Trip Costs and every category on your Shopping List.</div>
      <div class="table-scroll">
      <table>
        <thead><tr><th class="wide-col">Category</th><th class="num">Budget</th><th class="num">Actual</th><th class="num">Variance</th></tr></thead>
        <tbody>
          ${rows || `<tr><td colspan="4" style="text-align:center;color:var(--ink-soft);font-style:italic;">Add cost lines or shopping items to see them here.</td></tr>`}
          <tr class="grandtotal">
            <td class="wide-col" data-label="Category">Grand Total</td>
            <td class="num" data-label="Budget">${money(g.budget)}</td>
            <td class="num" data-label="Actual">${money(g.actual)}</td>
            <td class="num ${(g.actual-g.budget)>0?'neg':'pos'}" data-label="Variance">${(g.actual-g.budget)>0?'+':''}${money(g.actual-g.budget)}</td>

        <div><div class="label">${surplus>=0?'Surplus':'Shortfall'}</div><div class="big">${surplus>=0?'+':''}${money(surplus)}</div></div>
        <div style="max-width:340px;font-size:12.5px;color:var(--ink-soft);">

    return `
      <div class="panel-section">

        <div class="section-note">Optional — track how many fish each member caught, per day. Off by default.</div>
        <button class="btn ghost sm" id="btnEnableCatchLog">🎣 Turn on Catch Log</button>

  }

  if(!t.people.length || !t.days.length){
    return `
      <div class="panel-section">
        <div class="section-head"><h2>Catch Log</h2>
          ${ADMIN?'<button class="btn ghost sm" id="btnDisableCatchLog">Turn off</button>':''}
        </div>
        <div class="empty">Add members and days (in Meal Plan) to start logging catches.</div>

  return `

            <td>Daily total</td>

            <td class="num"><b>${catchGrandTotal(t)}</b></td>

}

function formatDayDate(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d.getTime())) return '';
  return d.toLocaleDateString(undefined, {weekday:'short', day:'numeric', month:'short', year:'numeric'});
}

        </div>

    `;
    }).join('');
    return `
    <div class="day-card" data-day="${d.id}">
      <div class="day-title">
        <span class="day-title-text">${escapeHtml(d.label)}</span>
      </div>

    </div>
  `;
  }).join('');

  return `
    <div class="panel-section">
      <div class="section-head"><h2>🗓️ Itinerary</h2></div>

      <div class="day-grid">
        ${cards || `<div class="empty">No days added yet — add days in the Meal Plan tab first.</div>`}
      </div>
    </div>
  `;
}

/* ---------- Shopping List ---------- */
function renderShopping(t){
  const totals = shoppingTotals(t);
  const catList = [...new Set(t.shopping.map(i=>i.category).filter(Boolean))];
  const storeList = [...new Set(t.shopping.map(i=>i.store).filter(Boolean))];
  const colHeaders = `<th class="check-col"></th><th class="wide-col">Item</th><th>Store</th><th>Category</th><th class="num">Qty</th><th class="num">Budget</th><th class="num">Cost/Unit</th><th class="num">Actual</th><th></th>`;

  let body = '';
  if(!t.shopping.length){
    body = `<div class="empty">No items yet — add what you need to buy, and group it by category or store.</div>`;
  } else if(state.shoppingView==='category'){
    const groups = groupShopping(t,'category');
    groups.forEach(gr=>{
      const groupKey = escapeHtml(gr.label);
      body += `<table style="margin-bottom:18px"><tbody>
        <tr class="group-head"><td colspan="9">
          <div class="group-head-row">
            <span>${groupKey}</span>
            ${ADMIN?`<button class="btn ghost sm group-add-btn" data-add-category="${groupKey}">+ Add</button>`:''}
          </div>
        </td></tr>
        <tr>${colHeaders}</tr>
        ${gr.items.map(itemRow).join('')}
        <tr class="subtotal"><td colspan="5">Subtotal</td><td class="num" data-label="Budget">${money2(gr.budget)}</td><td></td><td class="num" data-label="Actual">${money2(gr.actual)}</td><td></td></tr>
      </tbody></table>`;
    });
  } else {
    const groups = groupShopping(t,'store');
    groups.forEach(gr=>{
      const groupKey = escapeHtml(gr.label);
      body += `<table style="margin-bottom:18px"><tbody>
        <tr class="group-head"><td colspan="9">
          <div class="group-head-row">
            <span>${groupKey}</span>
            ${ADMIN?`<button class="btn ghost sm group-add-btn" data-add-store="${groupKey}">+ Add</button>`:''}
          </div>
        </td></tr>
        <tr>${colHeaders}</tr>
        ${gr.items.map(itemRow).join('')}
        <tr class="subtotal"><td colspan="5">Subtotal</td><td class="num" data-label="Budget">${money2(gr.budget)}</td><td></td><td class="num" data-label="Actual">${money2(gr.actual)}</td><td></td></tr>
      </tbody></table>`;
    });
  }

  return `
    <div class="panel-section">
      <div class="section-head">
        <h2>🛒 Shopping List</h2>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <div class="toggle-group">
            <button data-view="category" class="${state.shoppingView==='category'?'active':''}">By Category</button>
            <button data-view="store" class="${state.shoppingView==='store'?'active':''}">By Store</button>
          </div>
          ${ADMIN?'<button class="btn ghost sm" id="addItem">+ Add uncategorised item</button>':''}
        </div>
      </div>
      <div class="section-note">Tick items off as you buy them. Spot something in the wrong group? Change its Store or Category right in the row and it'll move there automatically.</div>
      <div class="scroll-hint">↔ Swipe inside the table to see all columns</div>
      <div class="table-scroll">
      ${body}
      <table><tbody>
        <tr class="grandtotal"><td colspan="5">Grand Total</td><td class="num" data-label="Budget">${money2(totals.budget)}</td><td></td><td class="num" data-label="Actual">${money2(totals.actual)}</td><td></td></tr>
      </tbody></table>
      </div>
      <datalist id="catList">${catList.map(c=>`<option value="${escapeHtml(c)}">`).join('')}</datalist>
      <datalist id="storeList">${storeList.map(s=>`<option value="${escapeHtml(s)}">`).join('')}</datalist>

function itemRow(item){
  const RO = ADMIN ? '' : 'disabled';
  const lineActual = (Number(item.qty)||0) * (Number(item.unitActual)||0);
  return `<tr data-item="${item.id}" class="${item.purchased?'purchased-row':''}">
    <td class="check-col" data-label=""><input type="checkbox" class="item-purchased" ${item.purchased?'checked':''} title="Purchased" ${RO}></td>
    <td class="wide-col" data-label="Item"><input type="text" class="item-name" value="${escapeHtml(item.item)}" placeholder="Item" ${RO}></td>
    <td data-label="Store"><input type="text" class="item-store" list="storeList" value="${escapeHtml(item.store||'')}" placeholder="Store" ${RO}></td>
    <td data-label="Category"><input type="text" class="item-category" list="catList" value="${escapeHtml(item.category||'')}" placeholder="Category" ${RO}></td>
    <td class="num" data-label="Qty"><input type="number" class="item-qty" value="${item.qty??1}" ${RO}></td>
    <td class="num" data-label="Budget">${moneyField('item-budget', item.budget||0, RO)}</td>
    <td class="num" data-label="Cost/Unit">${moneyField('item-unit', item.unitActual||0, `step="0.01" title="Cost per unit" ${RO}`)}</td>
    <td class="num" data-label="Actual"><span class="computed-actual">${money2(lineActual)}</span></td>
    <td class="row-actions">${ADMIN?'<button class="del item-del" title="Remove">✕</button>':''}</td>
  </tr>`;
}

  }));

function qa(sel){ return Array.from(document.querySelectorAll(sel)); }
function id(x){ return document.getElementById(x); }
function rowId(e, attr){
  attr = attr || (e.target.closest('[data-role]') ? 'role' : e.target.closest('[data-person]') ? 'person' : e.target.closest('[data-cost]') ? 'cost' : e.target.closest('[data-day]') ? 'day' : 'item');
  const row = e.target.closest('[data-'+attr+']');
  return row ? row.getAttribute('data-'+attr) : null;
}
function findRole(t,id){ return t.roles.find(r=>r.id===id); }
function findPerson(t,id){ return t.people.find(p=>p.id===id); }
function findCost(t,id){ return t.costs.find(c=>c.id===id); }
function findDay(t,id){ return t.days.find(d=>d.id===id); }
function findItem(t,id){ return t.shopping.find(i=>i.id===id); }
function findActivity(t,id){ return t.activities.find(a=>a.id===id); }

function renderBackendGate(){
  return `

        <div class="section-note" style="margin-bottom:16px">
          This app stores trip data in a Google Sheet you (or your admin) control. Paste the Web App URL
          from your Apps Script deployment below — see SETUP.md for how to create one (takes about 5 minutes,
          one-time, free). Everyone using this trip needs the same URL.
        </div>
        <div class="field">
          <label>Apps Script Web App URL</label>
          <input type="text" id="backendUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
        </div>
        <div class="modal-actions">
          <button class="btn" id="confirmBackendUrl">Connect</button>
        </div>
        <div id="backendTestMsg" class="section-note" style="margin-top:10px"></div>
      </div>
    </div>
  `;
}
function bindBackendGate(){
  document.getElementById('confirmBackendUrl').addEventListener('click', async ()=>{
    const input = document.getElementById('backendUrlInput');
    const msg = document.getElementById('backendTestMsg');
    const url = input.value.trim();
    if(!url || !/^https:\/\/script\.google(\.com|usercontent\.com)\//.test(url)){
      msg.textContent = 'That doesn\u2019t look like a Google Apps Script Web App URL — double check you copied the "/exec" link.';
      msg.style.color = 'var(--danger)';
      return;
    }
    msg.textContent = 'Checking connection…';
    msg.style.color = 'var(--ink-soft)';
    setBackendUrl(url);
    const test = await backendGet('trips-index');
    if(!test.ok){
      msg.textContent = 'Couldn\u2019t reach that URL (' + test.error + '). Double-check the deployment is set to "Anyone with the link", then try again.';
      msg.style.color = 'var(--danger)';
      localStorage.removeItem(LS_BACKEND_URL_KEY);
      return;
    }
    init();
  });
}

    if(!nameInput) return; // modal already closed by an earlier click — nothing to do

        <div id="importMsg" class="section-note"></div>
        <div class="modal-actions">
          <button class="btn ghost sm" id="cancelImport">Cancel</button>
          <button class="btn" id="confirmImport">Import</button>
        </div>
      </div>
    </div>
  `;
}

function bindImportModal(t){
  const close = ()=>{ state.showImportModal=false; render(); };
  document.getElementById('cancelImport').addEventListener('click', close);
  const backdrop = document.getElementById('importBackdrop');
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) close(); });
  document.getElementById('confirmImport').addEventListener('click', ()=>{
    const msg = document.getElementById('importMsg');
    let data;
    try{
      data = JSON.parse(document.getElementById('importText').value);
    }catch(e){
      msg.textContent = 'That\u2019s not valid JSON \u2014 check for a missing bracket or comma.';
      msg.style.color = 'var(--danger)';
      return;
    }
    try{
      applyImport(t, data);
      touchIndex();
      state.showImportModal = false;
      scheduleSave();
      render();
    }catch(e){
      msg.textContent = 'Import failed: ' + e.message;
      msg.style.color = 'var(--danger)';
    }
  });
}

/* ============================= Manage Access (Developer only) ============================= */
function renderManageAccessModal(){
  const levelSelect = (u)=>`
    <select class="access-level-select">
      ${Object.entries(ACCESS_LEVELS).map(([k,v])=>`<option value="${k}" ${u.level===k?'selected':''}>${v.label}</option>`).join('')}
    </select>
  `;
  const rows = state.userDirectory.map((u,i)=>`
    <tr data-access-index="${i}">
      <td class="wide-col"><input type="text" class="access-name" value="${escapeHtml(u.name)}" placeholder="Full name"></td>
      <td>${levelSelect(u)}</td>
      <td class="row-actions"><button class="del access-del" title="Remove access">✕</button></td>
    </tr>
  `).join('');

  return `
    <div class="modal-backdrop" id="manageAccessBackdrop">
      <div class="modal" style="max-width:560px">
        <h2>👑 Manage Access</h2>
        <div class="section-note" style="margin-bottom:14px">
          Who can sign in and what they can do. <b>Developer</b> can edit everything and manage this list.
          <b>Admin</b> can edit trip content but not this list. <b>Member</b> is read-only. Access is matched by
          the exact name someone types in when they sign in.
        </div>
        <table>
          <thead><tr><th class="wide-col">Name</th><th>Level</th><th></th></tr></thead>
          <tbody id="accessRows">${rows}</tbody>
        </table>
        <button class="btn ghost sm" id="addAccessRow" style="margin-top:10px">+ Add person</button>
        <div id="accessMsg" class="section-note" style="margin-top:10px"></div>
        <div class="modal-actions">
          <button class="btn" id="closeManageAccess">Done</button>
        </div>
      </div>
    </div>
  `;
}

function bindManageAccessModal(){
  const close = ()=>{ state.showManageAccessModal=false; render(); };
  const msgEl = document.getElementById('accessMsg');
  function showMsg(text, isError){
    msgEl.textContent = text;
    msgEl.style.color = isError ? 'var(--danger)' : 'var(--ink-soft)';
  }

  document.getElementById('closeManageAccess').addEventListener('click', close);
  const backdrop = document.getElementById('manageAccessBackdrop');
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) close(); });

  document.querySelectorAll('#accessRows .access-name').forEach(el=>{
    el.addEventListener('input', e=>{
      const i = e.target.closest('[data-access-index]').dataset.accessIndex;
      state.userDirectory[i].name = e.target.value;
      saveUserDirectory();
    });
  });
  document.querySelectorAll('#accessRows .access-level-select').forEach(el=>{
    el.addEventListener('change', e=>{
      const i = e.target.closest('[data-access-index]').dataset.accessIndex;
      const entry = state.userDirectory[i];
      const newLevel = e.target.value;
      if(entry.level==='developer' && newLevel!=='developer' && countDevelopers()<=1){
        showMsg('Can\u2019t demote the last Developer — promote someone else first.', true);
        e.target.value = 'developer';
        return;
      }
      entry.level = newLevel;
      saveUserDirectory();
      showMsg('Saved.', false);
      // If the person being changed is ME, my own access updates live.
      if(state.identity && entry.name.trim().toLowerCase()===state.identity.name.trim().toLowerCase()){
        computeAdmin();
      }
    });
  });
  document.querySelectorAll('#accessRows .access-del').forEach(el=>{
    el.addEventListener('click', e=>{
      const i = e.target.closest('[data-access-index]').dataset.accessIndex;
      const entry = state.userDirectory[i];
      if(entry.level==='developer' && countDevelopers()<=1){
        showMsg('Can\u2019t remove the last Developer — promote someone else first.', true);
        return;
      }
      state.userDirectory.splice(i,1);
      saveUserDirectory();
      state.showManageAccessModal = true; // stay open
      render();
    });
  });
  document.getElementById('addAccessRow').addEventListener('click', ()=>{
    state.userDirectory.push({name:'', level:'member'});
    saveUserDirectory();
    render();
  });
}

/* ============================= Invite (QR code / link) ============================= */
function buildInviteUrl(){
  const backend = getBackendUrl();
  const base = window.location.origin + window.location.pathname;
  return base + '?b=' + encodeURIComponent(backend);
}
function renderInviteModal(){
  const url = buildInviteUrl();
  return `
    <div class="modal-backdrop" id="inviteBackdrop">
      <div class="modal" style="max-width:420px; text-align:center">
        <h2>📱 Invite a member</h2>
        <div class="section-note" style="margin-bottom:14px">
          Scan this with a phone camera, or share the link below in a text or WhatsApp message.
          It opens the app and connects automatically — no setup needed, they just type their name.
        </div>
        <div id="inviteQr" style="display:flex; justify-content:center; margin:14px 0;"></div>
        <div class="field">
          <label>Or copy this link</label>
          <input type="text" id="inviteLinkText" readonly value="${escapeHtml(url)}" style="width:100%; border:1px solid var(--line); border-radius:4px; padding:8px; font-family:'IBM Plex Mono',monospace; font-size:11px; text-align:center;">
        </div>
        <div id="inviteCopyMsg" class="section-note"></div>
        <div class="modal-actions" style="justify-content:center">
          <button class="btn ghost sm" id="copyInviteLink">📋 Copy link</button>
          <button class="btn" id="closeInvite">Done</button>
        </div>
      </div>
    </div>
  `;
}
function bindInviteModal(){
  const close = ()=>{ state.showInviteModal=false; render(); };
  document.getElementById('closeInvite').addEventListener('click', close);
  const backdrop = document.getElementById('inviteBackdrop');
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) close(); });

  // qrcode-generator auto-picks a type/version; -1 lets it choose the
  // smallest one that fits this URL, 'M' balances scan-reliability and size.
  try{
    const qr = qrcode(-1, 'M');
    qr.addData(buildInviteUrl());
    qr.make();
    document.getElementById('inviteQr').innerHTML = qr.createSvgTag({scalable:true});
    const svg = document.getElementById('inviteQr').querySelector('svg');
    if(svg){ svg.style.width='220px'; svg.style.height='220px'; }
  }catch(e){
    document.getElementById('inviteQr').innerHTML = '<div class="empty">Couldn\u2019t generate a QR code \u2014 use the link below instead.</div>';
  }

  document.getElementById('copyInviteLink').addEventListener('click', async ()=>{
    const input = document.getElementById('inviteLinkText');
    const msg = document.getElementById('inviteCopyMsg');
    try{
      await navigator.clipboard.writeText(input.value);
      msg.textContent = 'Copied!';
    }catch(e){
      input.select();
      msg.textContent = 'Link selected \u2014 copy it manually (Ctrl/Cmd+C).';
    }
  });
}

function applyImport(t, data){
  if(data.name) t.name = String(data.name);
  if(data.startDate !== undefined) t.startDate = String(data.startDate||'');
  if(data.catchLogEnabled !== undefined) t.catchLogEnabled = !!data.catchLogEnabled;
  if(data.location){
    t.location = {name: data.location.name||'', mapsUrl: data.location.mapsUrl||''};
  }
  if(Array.isArray(data.costs)){
    t.costs = data.costs.map(c=>({id:uid(), label:c.label||'', budget:Number(c.budget)||0, actual:Number(c.actual)||0}));
  }
  const roleIdByLabel = {};
  if(Array.isArray(data.roles)){
    t.roles = data.roles.map(r=>{
      const id = uid();
      roleIdByLabel[r.label] = id;
      return {id, label:r.label||'', amount:Number(r.amount)||0};
    });
  }
  if(Array.isArray(data.people)){
    t.people = data.people.map(p=>({
      id: uid(),
      name: p.name||'',
      phone: p.phone||'',
      roleId: roleIdByLabel[p.roleLabel] || (t.roles[0] && t.roles[0].id) || '',
      paid: Number(p.paid)||0,
    }));
  }
  if(Array.isArray(data.days)){
    t.days = data.days.map(d=>({id:uid(), label:d.label||'', breakfast:d.breakfast||'', lunch:d.lunch||'', dinner:d.dinner||''}));
  }
  if(Array.isArray(data.activities)){
    t.activities = data.activities
      .filter(a=>t.days[a.dayIndex])
      .map((a,i)=>({
        id: uid(),
        dayId: t.days[a.dayIndex].id,
        type: a.type || 'activity',
        time: a.time||'',
        endTime: a.endTime||'',
        title: a.title||'',
        location: {name: (a.location&&a.location.name)||'', mapsUrl: (a.location&&a.location.mapsUrl)||''},
        notes: a.notes||'',
        order: a.order===undefined ? i : a.order,
      }));
  }
  if(Array.isArray(data.shopping)){
    t.shopping = data.shopping.map(s=>({
      id: uid(),
      item: s.item||'',
      category: s.category||'',
      store: s.store||'',
      qty: s.qty===undefined ? 1 : Number(s.qty),
      budget: Number(s.budget)||0,
      unitActual: Number(s.unitActual)||0,
      purchased: !!s.purchased,
    }));
  }
}

init();
</script>
