<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>My Trip Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFE8D8;
    --paper-dark:#E4DAC0;
    --paper-darker:#D8CBA9;
    --ink:#2A2A22;
    --ink-soft:#6b6a58;
    --pine:#1F4B3F;
    --pine-deep:#123128;
    --pine-tint:#DCE7DF;
    --rust:#C1622B;
    --rust-tint:#F3DFCC;
    --brass:#9C7F32;
    --danger:#9C3B2E;
    --danger-tint:#F2DAD3;
    --line:#C9BFA3;
    --line-soft:#DDD3B6;
    --shadow: 0 2px 0 rgba(42,42,34,0.08);
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 8% 0%, rgba(31,75,63,0.06), transparent 40%),
      var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    letter-spacing:.04em;
    font-weight:600;
    color:var(--pine-deep);
    margin:0;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  #app{max-width:1080px;margin:0 auto;padding:20px 18px 80px;}

  /* ---------- Trip tag header ---------- */
  .tag{
    position:relative;
    background:var(--pine);
    color:#F4EFE0;
    border-radius:10px;
    padding:22px 26px 20px 44px;
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:18px;
    justify-content:space-between;
    background-image:
      radial-gradient(circle at 18px 50%, var(--paper) 7px, rgba(0,0,0,0) 7.5px),
      repeating-linear-gradient(0deg, rgba(244,239,224,0.14) 0 1px, transparent 1px 9px);
    background-position: 0 0, 0 0;
    border:1.5px dashed rgba(244,239,224,0.35);
    box-shadow: 0 6px 0 rgba(18,49,40,0.25);
  }
  .tag::before{
    content:"";
    position:absolute;
    left:11px; top:50%; transform:translateY(-50%);
    width:14px;height:14px;border-radius:50%;
    border:2px solid var(--pine);
    background:var(--paper);
  }
  .tag .tag-left{display:flex; align-items:center; gap:14px; min-width:0;}
  .header-identity{
    position:absolute; top:10px; right:14px;
    display:flex; align-items:center; gap:8px;
    font-size:11px; color:#DDD6C1;
    background:rgba(18,49,40,0.35);
    border:1px solid rgba(244,239,224,0.25);
    border-radius:16px;
    padding:4px 10px;
    z-index:2;
  }
  .header-identity b{color:#F4EFE0;}
  .tag .glyph{
    font-size:28px; line-height:1;
    filter:drop-shadow(0 1px 0 rgba(0,0,0,0.25));
  }
  .cover-thumb{
    width:56px; height:56px; border-radius:8px; flex:none;
    background:rgba(244,239,224,0.12); border:1.5px solid rgba(244,239,224,0.35);
    display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative;
  }
  .cover-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .cover-edit-badge{
    position:absolute; right:-4px; bottom:-4px; background:var(--rust); border-radius:50%;
    width:20px; height:20px; display:flex; align-items:center; justify-content:center; font-size:10px;
    border:2px solid var(--pine);
  }
  .loc-line{margin-top:4px; font-size:11.5px;}
  .loc-line a{color:#F4EFE0; text-decoration:underline; text-decoration-color:rgba(244,239,224,0.5);}
  .loc-add{cursor:pointer; opacity:.75; text-decoration:underline dotted;}
  .loc-edit{cursor:pointer; opacity:.65; margin-left:8px; text-decoration:underline dotted; font-size:10.5px;}
  .backend-chip{font-size:10px; letter-spacing:.03em;}
  .backend-chip.ok{color:var(--pine);}
  .backend-chip.warn{color:var(--rust);}
  .access-badge{
    display:inline-block; font-family:'Oswald',sans-serif; font-size:10px; letter-spacing:.05em; text-transform:uppercase;
    padding:3px 10px; border-radius:12px; border:1px solid var(--line);
  }
  .access-badge.developer{background:var(--rust-tint); color:var(--rust); border-color:#e0b28c; font-weight:600;}
  .access-badge.admin{background:var(--pine-tint); color:var(--pine-deep); border-color:#a9c6b8;}
  .access-badge.member{background:var(--paper-dark); color:var(--ink-soft);}
  .access-badge.ok{background:var(--pine-tint); color:var(--pine-deep); border-color:#a9c6b8;}
  .access-badge.soon{background:var(--rust-tint); color:var(--rust); border-color:#e0b28c;}
  .access-badge.danger{background:var(--danger-tint); color:var(--danger); border-color:#d9b2a8; font-weight:600;}
  .doc-card{border:1px solid var(--line-soft); border-radius:var(--radius); padding:12px 14px; margin-bottom:10px; background:var(--paper-dark);}
  .doc-card-head{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
  .doc-card-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:8px 12px;}
  .doc-field label{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-bottom:2px;}
  .doc-thumb{width:44px; height:44px; border-radius:4px; object-fit:cover; border:1px solid var(--line); cursor:pointer; flex-shrink:0;}
  .doc-thumb-empty{width:44px; height:44px; border-radius:4px; border:1px dashed var(--line); display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; flex-shrink:0; color:var(--ink-soft);}
  .tag .titles{min-width:0;}
  .tag h1{font-size:22px; color:#F4EFE0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:46vw;}
  .tag .sub{font-size:11px; letter-spacing:.12em; text-transform:uppercase; opacity:.75; margin-top:3px;}
  .tag .stats{display:flex; gap:10px; flex-wrap:wrap;}
  .stat-chip{
    background:rgba(244,239,224,0.12);
    border:1px solid rgba(244,239,224,0.3);
    border-radius:20px;
    padding:6px 14px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    display:flex; flex-direction:column; align-items:center; gap:1px;
    min-width:78px;
  }
  .stat-chip b{font-size:14px;}
  .stat-chip span{font-size:9px; letter-spacing:.08em; text-transform:uppercase; opacity:.7;}
  .stat-chip.warn{background:rgba(193,98,43,0.25); border-color:rgba(193,98,43,0.55);}
  .stat-chip.ok{background:rgba(70,130,100,0.25); border-color:rgba(70,130,100,0.5);}
  .stat-chip.sm{
    background:var(--paper-dark); border:1px solid var(--line); color:var(--ink);
    padding:4px 9px; min-width:0; gap:0;
  }
  .stat-chip.sm b{font-size:11.5px;}
  .stat-chip.sm span{font-size:8px; color:var(--ink-soft);}
  .stat-chip.sm.ok{background:rgba(70,130,100,0.14); border-color:#a9c6b8; color:var(--pine-deep);}
  .stat-chip.sm.warn{background:rgba(193,98,43,0.14); border-color:#e0b28c; color:var(--rust);}
  .role-badge-clickable{ transition:opacity .1s; }
  .role-badge-clickable:hover{ opacity:0.75; }

  .switcher{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  }
  select, button, input, textarea{
    font-family:'Work Sans', sans-serif;
    font-size:13px;
  }
  .btn{
    appearance:none; border:1px solid var(--pine); background:var(--pine); color:#F4EFE0;
    padding:8px 14px; border-radius:4px; cursor:pointer; font-weight:600; letter-spacing:.02em;
    box-shadow: var(--shadow);
  }
  .btn:hover{background:var(--pine-deep);}
  .btn.ghost{background:transparent; color:var(--pine); border:1px solid var(--pine);}
  .btn.ghost:hover{background:var(--pine-tint);}
  .btn.rust{background:var(--rust); border-color:var(--rust);}
  .btn.rust:hover{background:#a4501f;}
  .btn.sm{padding:5px 10px; font-size:12px;}
  .btn.icon{padding:6px 9px; line-height:1;}
  select.trip-select{
    background:var(--paper); border:1px solid var(--line); border-radius:4px; padding:7px 10px;
    color:var(--ink); font-weight:500; max-width:220px;
  }

  /* ---------- Tabs ---------- */
  .tabs{
    display:flex; gap:2px; margin-top:18px; border-bottom:2px solid var(--pine-deep);
    overflow-x:auto;
  }
  .tab{
    padding:10px 16px; cursor:pointer; white-space:nowrap;
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.05em; font-size:12.5px;
    color:var(--ink-soft); background:var(--paper-dark); border:1px solid var(--line-soft); border-bottom:none;
    border-radius:6px 6px 0 0; position:relative; top:2px;
  }
  .tab.active{
    color:#F4EFE0; background:var(--pine-deep); border-color:var(--pine-deep);
  }

  .panel{
    background:#F7F2E6; border:1px solid var(--line); border-top:none;
    border-radius:0 0 8px 8px; padding:22px;
    box-shadow: var(--shadow);
  }
  .panel-section + .panel-section{margin-top:26px; padding-top:22px; border-top:1px dashed var(--line);}
  .panel-page-title{
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-size:20px;
    color:var(--pine-deep); font-weight:700; margin-bottom:18px; padding-bottom:12px; border-bottom:2px solid var(--pine);
  }
  .section-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap;}
  .section-head h2{font-size:16px;}
  .section-note{font-size:11.5px; color:var(--ink-soft); font-style:italic; margin-top:-6px; margin-bottom:14px;}

  table{width:100%; border-collapse:collapse;}
  .wide-col{width:26%; min-width:170px;}
  /* Members table specifically: names don't need as much room as Item/Category
     text elsewhere, and mobile numbers were getting clipped without a
     guaranteed minimum — this fixes both in one pass. */
  .name-col{width:22%; min-width:140px;}
  .name-col input{min-width:130px;}
  .mobile-col{width:auto; min-width:112px;}
  .mobile-col input{min-width:100px;}
  .check-col{width:34px; text-align:center; padding-left:4px; padding-right:4px;}
  .check-col input[type=checkbox]{width:16px; height:16px; cursor:pointer;}
  tr.purchased-row .item-name{text-decoration:line-through; opacity:0.55;}
  tr.purchased-row td{opacity:0.75;}
  th{
    text-align:left; font-family:'Oswald',sans-serif; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-soft); border-bottom:2px solid var(--line); padding:8px 8px;
  }
  td{padding:6px 8px; border-bottom:1px solid var(--line-soft); vertical-align:middle;}
  tr.subtotal td{background:var(--paper-dark); font-weight:600; font-family:'IBM Plex Mono',monospace;}
  tr.grandtotal td{background:var(--pine-tint); font-weight:700; font-family:'IBM Plex Mono',monospace; border-top:2px solid var(--pine);}
  tr.group-head td{
    background:var(--pine-deep); color:#F4EFE0; font-family:'Oswald',sans-serif; text-transform:uppercase;
    letter-spacing:.05em; font-size:12px; padding-top:8px; padding-bottom:8px;
  }
  .group-head-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .group-add-btn{
    background:transparent; color:#F4EFE0; border-color:rgba(244,239,224,0.5);
    text-transform:none; letter-spacing:normal; font-size:11px; padding:4px 10px;
  }
  .group-add-btn:hover{background:rgba(244,239,224,0.15);}
  td input[type=text], td input[type=number], td select{
    width:100%; border:1px solid transparent; background:transparent; padding:5px 6px; border-radius:3px;
    color:var(--ink); font-size:13px;
  }
  td input:hover, td select:hover{border-color:var(--line);}
  td input:focus, td select:focus{border-color:var(--pine); outline:none; background:#fff;}
  .num{font-family:'IBM Plex Mono',monospace; text-align:right;}
  .num input{text-align:right;}
  .money-input-wrap{
    display:block; width:100%; text-align:right; white-space:nowrap;
  }
  .money-input-wrap .currency-prefix{
    color:var(--ink-soft); font-size:12px; margin-right:1px;
  }
  .money-input-wrap input[type=number]{
    width:7em; text-align:right; padding-left:2px; display:inline-block; vertical-align:middle;
  }
  .neg{color:var(--danger);}
  .pos{color:var(--pine);}
  .row-actions{width:34px; text-align:center;}
  .del{background:none; border:none; cursor:pointer; color:var(--ink-soft); font-size:15px; padding:2px 6px; border-radius:3px;}
  .del:hover{color:var(--danger); background:var(--danger-tint);}
  .catch-day-date{font-size:9px; font-weight:400; text-transform:none; letter-spacing:0; color:var(--rust); font-family:'IBM Plex Mono',monospace; margin-top:2px;}
  .catch-cell{max-width:56px; text-align:center;}
  .role-abbr-badge{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:11px;
    background:var(--pine-tint); color:var(--pine-deep); border-radius:4px; padding:2px 7px;
  }
  .person-role{max-width:52px; text-align:center; font-family:'IBM Plex Mono',monospace; font-weight:600;}

  .addrow{margin-top:10px;}

  .banner{
    border-radius:8px; padding:16px 18px; display:flex; align-items:center; justify-content:space-between;
    gap:16px; flex-wrap:wrap; margin-top:18px;
  }
  .banner.ok{background:var(--pine-tint); border:1px solid #a9c6b8;}
  .banner.warn{background:var(--danger-tint); border:1px solid #d9b2a8;}
  .banner .big{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600;}
  .banner .label{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.05em; font-size:12px; color:var(--ink-soft);}

  .toggle-group{display:flex; border:1px solid var(--pine); border-radius:20px; overflow:hidden;}
  .toggle-group button{
    border:none; background:var(--paper); color:var(--pine); padding:6px 14px; cursor:pointer;
    font-family:'Oswald',sans-serif; font-size:11.5px; letter-spacing:.05em; text-transform:uppercase;
  }
  .toggle-group button.active{background:var(--pine); color:#F4EFE0;}

  .empty{
    text-align:center; padding:36px 20px; color:var(--ink-soft); font-style:italic;
    border:1.5px dashed var(--line); border-radius:8px;
  }
  .empty-glyph{font-size:26px; display:block; margin-bottom:8px; font-style:normal;}
  .empty-title{
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-size:13px;
    color:var(--pine-deep); font-style:normal; font-weight:600; margin-bottom:4px;
  }
  .empty .btn{font-style:normal; margin-top:14px;}
  .empty-link{
    font-style:normal; text-decoration:underline dotted; cursor:pointer; color:var(--pine); font-weight:600;
  }
  .empty-link:hover{color:var(--pine-deep);}

  .loading-screen{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:80px 20px; text-align:center;
  }
  .loading-spinner{
    width:36px; height:36px; border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--rust);
    animation:spin 0.8s linear infinite;
  }
  .loading-msg{
    font-family:'Oswald',sans-serif; font-size:13px; letter-spacing:.04em; text-transform:uppercase;
    color:var(--ink-soft);
  }
  .loading-retry{
    max-width:280px; display:flex; flex-direction:column; align-items:center; gap:10px; margin-top:4px;
  }
  .loading-retry .section-note{ text-align:center; margin:0; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .day-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px;}
  .day-card{
    background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:14px;
    position:relative;
  }
  .day-card .day-title{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;
  }
  .day-card .day-title input{
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-size:14px;
    border:none; background:transparent; color:var(--pine-deep); font-weight:600; padding:2px 0; width:70%;
  }
  .day-date-formatted{
    font-size:11px; color:var(--rust); font-weight:600; font-family:'Oswald',sans-serif;
    letter-spacing:.03em; text-transform:uppercase; margin:-6px 0 10px;
  }
  .trip-start-row{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;
    background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:10px 14px;
  }
  .trip-start-row label{
    font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-family:'Oswald',sans-serif;
  }
  .trip-start-row input[type=date]{
    border:1px solid var(--line); border-radius:4px; padding:5px 8px; font-size:12px;
    font-family:'IBM Plex Mono',monospace; background:#fff; color:var(--ink);
  }
  .trip-date-range{
    font-size:12px; color:#F4EFE0; font-weight:600; margin-left:8px; opacity:0.9;
  }
  .balance-forward-row{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--paper); border:1px solid var(--line); border-radius:8px; padding:10px 14px;
  }
  .balance-forward-row .balance-forward-label{
    flex:1; min-width:160px; border:1px solid var(--line); border-radius:4px; padding:6px 8px;
    font-size:12.5px; background:#fff;
  }
  .balance-forward-row .money-input-wrap{
    flex:none; width:110px; border:1px solid var(--line); border-radius:4px; padding:6px 8px; background:#fff;
    font-family:'IBM Plex Mono',monospace; font-size:13px;
  }
  .meal-row{margin-bottom:8px;}
  .meal-row label{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-family:'Oswald',sans-serif;}
  .meal-row textarea{
    width:100%; border:1px solid var(--line); border-radius:4px; padding:6px 8px; resize:vertical; min-height:34px;
    font-family:'Work Sans',sans-serif; font-size:12.5px; margin-top:3px; background:#fff;
  }

  .day-title-text{
    font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:.04em; font-size:14px;
    color:var(--pine-deep); font-weight:600;
  }
  .activity-list{display:flex; flex-direction:column; gap:10px;}
  .activity-card{
    background:var(--paper); border:1px solid var(--line); border-radius:6px; padding:8px;
    display:flex; flex-direction:column; gap:6px;
  }
  .activity-top-row{display:flex; align-items:center; gap:6px;}
  .activity-type{
    border:1px solid var(--line); border-radius:4px; padding:4px 6px; font-size:12px;
    background:#fff; flex:none; max-width:130px;
  }
  .activity-reorder{display:flex; gap:2px; margin-left:auto;}
  .activity-reorder .btn{padding:2px 7px; font-size:10px; line-height:1.4;}
  .activity-reorder .btn:disabled{opacity:0.3; cursor:default;}
  .activity-top-row .activity-del{flex:none;}
  .activity-time-row{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .activity-time-row .activity-time, .activity-time-row .activity-endtime{
    border:1px solid var(--line); border-radius:4px; padding:5px 6px; font-size:11.5px;
    font-family:'IBM Plex Mono',monospace; background:#fff; flex:none; width:88px;
  }
  .activity-time-sep{color:var(--ink-soft); font-size:11px;}
  .activity-time-row .activity-title{
    flex:1; min-width:140px; border:1px solid var(--line); border-radius:4px; padding:5px 8px;
    font-size:12.5px; background:#fff;
  }
  .activity-loc-row{display:flex; align-items:center; gap:6px;}
  .activity-location{
    flex:1; border:1px solid var(--line); border-radius:4px; padding:5px 8px;
    font-size:11.5px; background:#fff;
  }
  .activity-map-link{
    flex:none; text-decoration:none; font-size:15px; padding:3px 6px; border:1px solid var(--line);
    border-radius:4px; background:#fff;
  }
  .activity-notes{
    border:1px solid var(--line); border-radius:4px; padding:5px 8px;
    font-size:11.5px; font-family:'Work Sans',sans-serif; background:#fff; resize:vertical; min-height:28px;
  }

  /* ---------- Itinerary timeline (TripIt-style) ---------- */
  .itinerary-timeline{ display:flex; flex-direction:column; gap:22px; }
  .itin-date-header{
    background:var(--paper-dark); padding:8px 14px; font-size:11.5px; font-weight:700;
    letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); border-radius:6px; margin-bottom:2px;
  }
  .itin-rows-wrap{ position:relative; }
  .itin-rows-wrap::before{
    content:''; position:absolute; left:114px; top:22px; bottom:22px; width:2px; background:var(--line); z-index:0;
  }
  .itin-row{ display:flex; align-items:flex-start; padding:14px 0; position:relative; }
  .itin-row + .itin-row{ border-top:1px dashed var(--line-soft); }
  .itin-time-col{
    width:92px; flex:none; display:flex; flex-direction:column; align-items:flex-end;
    padding-right:8px; padding-top:6px;
  }
  .itin-time-input{
    border:none; background:transparent; font-weight:700; font-size:14px; text-align:right;
    font-family:'IBM Plex Mono',monospace; color:var(--ink); padding:1px 0; width:100%; min-width:78px;
  }
  .itin-endtime-input{
    border:none; background:transparent; font-size:10.5px; text-align:right; color:var(--ink-soft);
    font-family:'IBM Plex Mono',monospace; padding:0; width:100%; min-width:78px;
  }
  /* Native time inputs draw their own clock icon inside the field — with the
     big circular type icon already sitting right next to it, that icon is
     redundant, and it was crowding the actual time digits in a narrow
     column, cutting them off. Hiding it frees up the space instead. */
  .itin-time-input::-webkit-calendar-picker-indicator,
  .itin-endtime-input::-webkit-calendar-picker-indicator{
    display:none; -webkit-appearance:none;
  }
  .itin-line-col{
    width:44px; flex:none; display:flex; justify-content:center; position:relative; z-index:1; padding-top:4px;
  }
  .itin-icon-badge{
    width:36px; height:36px; border-radius:50%; background:var(--pine-tint); border:2px solid var(--pine);
    display:flex; align-items:center; justify-content:center; position:relative; cursor:pointer;
  }
  .itin-icon-badge-emoji{ font-size:15px; pointer-events:none; }
  .itin-type-select{ position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer; border:none; }
  .itin-detail-col{ flex:1; min-width:0; padding:4px 0 0 12px; }
  .itin-detail-top-row{ display:flex; align-items:center; gap:8px; }
  .itin-title-input{
    flex:1; min-width:0; border:none; background:transparent; font-weight:600; font-size:14.5px;
    color:var(--ink); font-family:'Work Sans',sans-serif; padding:2px 0;
  }
  .itin-loc-row{ display:flex; align-items:center; gap:6px; margin-top:2px; }
  .itin-loc-input{
    flex:1; min-width:0; border:none; background:transparent; font-size:12px; color:var(--ink-soft);
    font-family:'Work Sans',sans-serif; padding:1px 0;
  }
  .itin-notes-input{
    display:block; width:100%; border:none; background:transparent; font-size:11.5px; color:var(--ink-soft);
    font-family:'Work Sans',sans-serif; resize:vertical; min-height:20px; padding:3px 0 0; margin-top:2px;
  }
  .place-suggestions{
    position:absolute; top:calc(100% + 2px); left:0; right:0; background:#fff; border:1px solid var(--line);
    border-radius:6px; box-shadow:var(--shadow); z-index:10; max-height:180px; overflow-y:auto;
  }
  .place-suggestion-item{
    padding:8px 10px; font-size:12px; color:var(--ink); cursor:pointer; border-bottom:1px solid var(--line-soft);
    line-height:1.3;
  }
  .place-suggestion-item:last-child{ border-bottom:none; }
  .place-suggestion-item:hover{ background:var(--paper-dark); }
  .itin-time-input:focus, .itin-endtime-input:focus, .itin-title-input:focus, .itin-loc-input:focus, .itin-notes-input:focus{
    outline:none; background:var(--paper-dark); border-radius:3px;
  }
  .itin-title-input::placeholder, .itin-loc-input::placeholder, .itin-notes-input::placeholder{ color:var(--ink-soft); opacity:0.7; }
  @media (max-width:640px), (max-height:520px) and (orientation:landscape){
    .itin-time-col{ width:74px; }
    .itin-time-input, .itin-endtime-input{ min-width:62px; font-size:12.5px; }
    .itin-rows-wrap::before{ left:96px; }
    .itin-title-input{ font-size:13.5px; }
  }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(18,49,40,0.45); display:flex; align-items:center; justify-content:center;
    z-index:50; padding:20px;
  }
  .modal{
    background:var(--paper); border-radius:10px; padding:24px; width:100%; max-width:420px;
    border:1px solid var(--line); box-shadow:0 10px 30px rgba(0,0,0,0.25);
  }
  .modal h2{margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:5px; font-family:'Oswald',sans-serif;}
  .field input[type=text], .field input[type=date], .field input[type=number], .field select{
    width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:4px; background:#fff;
  }
  .field-row{display:flex; gap:12px;}
  .field-row .field{flex:1; margin-bottom:14px;}
  .type-pick{display:flex; gap:8px;}
  .type-pick button{
    flex:1; padding:14px 8px; border:1.5px solid var(--line); background:#fff; border-radius:8px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:4px; font-family:'Oswald',sans-serif; font-size:11px;
    text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft);
  }
  .type-pick button .g{font-size:22px;}
  .type-pick button.active{border-color:var(--pine); background:var(--pine-tint); color:var(--pine-deep);}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}

  .footer-note{margin-top:26px; text-align:center; font-size:11px; color:var(--ink-soft); font-style:italic;}

  /* ---------- Auth screens (sign in / sign up / verify) ---------- */
  .auth-screen{
    min-height:100vh; min-height:100dvh; background:var(--pine-deep);
    display:flex; align-items:center; justify-content:center; padding:32px 18px;
  }
  .auth-card{
    background:#fff; border-radius:20px; padding:36px 28px 30px; width:100%; max-width:420px;
    box-shadow:0 20px 50px rgba(0,0,0,0.28);
  }
  .auth-logo{
    display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:26px;
  }
  .auth-logo-mark{font-size:26px;}
  .auth-logo-word{
    font-family:'Oswald',sans-serif; font-size:26px; font-weight:600; color:var(--ink);
    text-transform:lowercase; letter-spacing:.01em;
  }
  .auth-heading{
    font-family:'Oswald',sans-serif; font-size:24px; font-weight:600; color:var(--ink);
    text-align:center; line-height:1.3; margin-bottom:26px;
  }
  .auth-field{margin-bottom:18px;}
  .auth-field label{
    display:block; font-family:'Work Sans',sans-serif; font-size:14px; font-weight:600;
    color:var(--ink); margin-bottom:7px;
  }
  .auth-field input{
    width:100%; padding:13px 14px; border:1.5px solid var(--line); border-radius:10px;
    background:#fff; font-size:15px; font-family:'Work Sans',sans-serif; color:var(--ink);
  }
  .auth-field input:focus{outline:none; border-color:var(--pine);}
  .auth-password-wrap{position:relative;}
  .auth-password-wrap input{padding-right:44px;}
  .auth-password-toggle{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    background:none; border:none; cursor:pointer; font-size:16px; padding:8px; color:var(--ink-soft);
    line-height:1;
  }
  .auth-forgot{
    display:block; text-align:center; margin:4px 0 20px; font-family:'Work Sans',sans-serif;
    font-size:14px; font-weight:600; color:var(--pine-deep); text-decoration:underline;
  }
  .auth-submit{
    width:100%; padding:15px; border:none; border-radius:10px; background:var(--pine-deep); color:#fff;
    font-family:'Oswald',sans-serif; font-size:16px; text-transform:none; letter-spacing:0; cursor:pointer;
  }
  .auth-submit:hover{background:var(--pine);}
  .auth-submit:disabled{opacity:.6; cursor:default;}
  .auth-switch{
    text-align:center; margin-top:22px; font-family:'Work Sans',sans-serif; font-size:14px; color:var(--ink);
  }
  .auth-switch a{color:var(--pine-deep); font-weight:700; text-decoration:underline;}
  .auth-status{text-align:center; margin-top:14px; font-size:13px; min-height:16px;}

  @media (max-width:640px), (max-height:520px) and (orientation:landscape){
    html, body{ overflow-x:hidden; } /* hard safety net against any element pushing the page wider than the screen */

    .plans-header-row{flex-wrap:wrap;}
    .plans-title{font-size:19px;}
    .plan-card{flex-direction:column;}
    .plan-card-thumb{width:100%; height:120px;}
    .field-row{flex-direction:column; gap:0;}

    .tag{
      padding:16px 16px 16px 34px;
      flex-direction:column;
      align-items:stretch;
      gap:12px;
      overflow:hidden;
    }
    /* Grid (not flex) for the photo+text row — grid's 1fr track reliably
       shrinks long text to fit, which nested flexbox is notoriously
       unreliable at even with min-width:0 set throughout the chain. */
    .tag .tag-left{
      display:grid;
      grid-template-columns:56px minmax(0,1fr);
      align-items:center;
      gap:14px;
      width:100%;
      min-width:0;
    }
    .tag .titles{ min-width:0; overflow:hidden; }
    .tag h1{
      max-width:100%;
      font-size:18px;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .tag .sub, .loc-line{
      overflow-wrap:break-word;
      white-space:normal;
    }
    .stat-chip{min-width:64px; padding:5px 10px;}
    .header-identity{
      position:static;
      justify-content:flex-end;
      font-size:10px; flex-wrap:wrap; row-gap:4px;
      order:-1;
      max-width:100%;
    }

    #app{padding:14px 8px 60px;}
    .panel{padding:14px 8px;}
    .tab{padding:9px 10px; font-size:11px;}

    /* Wide tables (Shopping List, People, Costs, Overview) scroll
       sideways within their own contained box — the page itself still
       only scrolls up/down. Swiping *inside* a table scrolls the table;
       swiping anywhere else on the page switches tabs (see the touch
       handler in the script, which explicitly ignores touches that start
       inside .table-scroll so the two gestures don't fight each other). */
    .table-scroll{
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      margin:0 -8px;
      padding:0 8px;
    }
    .table-scroll table{ min-width:600px; }
    .table-scroll table td, .table-scroll table th{ white-space:nowrap; }
    .table-scroll table td input, .table-scroll table td select{ min-width:70px; }
    .table-scroll table td.row-actions{ min-width:34px; }
    .scroll-hint{ display:block; }

    /* Meal Plan days stack vertically too — no side-to-side swiping
       inside the page, that gesture is reserved for switching tabs. */
    .day-grid{
      display:block;
    }
    .day-grid .day-card{
      max-width:100%;
      margin-bottom:14px;
    }

    /* Members table: cards instead of a side-scrolling spreadsheet.
       Each person becomes one card — Name up top as the card's heading
       (no truncation, no horizontal scroll to find it), every other field
       stacked below as a label:value row using the data-label attribute
       already present on each <td>. */
    .stack-mobile{ min-width:0 !important; }
    .stack-mobile thead{ display:none; }
    .stack-mobile, .stack-mobile tbody{ display:block; width:100%; }
    .stack-mobile tr{
      display:block; background:#fff; border:1px solid var(--line); border-radius:8px;
      padding:4px 12px; margin-bottom:10px;
    }
    .stack-mobile tr.subtotal{ background:var(--paper-dark); border-color:var(--line); }
    .stack-mobile td{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      border-bottom:1px dashed var(--line-soft); padding:8px 0; white-space:normal;
    }
    .stack-mobile td:last-child{ border-bottom:none; }
    .stack-mobile td[data-label]::before{
      content:attr(data-label);
      font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:10px; letter-spacing:.05em;
      color:var(--ink-soft); flex:none;
    }
    .stack-mobile td input, .stack-mobile td select{ text-align:right; flex:1; min-width:0; width:auto; }
    .stack-mobile .name-col{ border-bottom:2px solid var(--line); }
    .stack-mobile .name-col::before{ content:none; }
    .stack-mobile .name-col input{
      font-family:'Oswald',sans-serif; font-weight:600; font-size:15px; text-align:left; color:var(--pine-deep);
    }
    .stack-mobile .row-actions{ justify-content:flex-end; padding-top:10px; }
  }
  .scroll-hint{ display:none; font-size:11px; color:var(--ink-soft); font-style:italic; margin:-6px 0 8px; }
  .tab-swipe-dots{ display:none; }
  @media (max-width:640px), (max-height:520px) and (orientation:landscape){
    .tab-swipe-dots{
      display:flex; justify-content:center; gap:6px; margin:14px 0 4px;
    }
    .tab-swipe-dots span{
      width:6px; height:6px; border-radius:50%; background:var(--line);
    }
    .tab-swipe-dots span.active{ background:var(--pine); }
  }

  /* ---------- My Plans / Account / trip-header navigation ---------- */
  .back-to-plans-row{margin-bottom:8px;}
  .account-title-row{ width:100%; } /* forces this whole block onto its own row within .tag's flex-wrap, so it can never overlap the identity badge beside it */
  .back-to-plans-row .loc-add{color:#F4EFE0; opacity:0.85; font-size:12px;}
  .back-to-plans-row .loc-add:hover{opacity:1; text-decoration:underline;}
  .header-date-input{
    background:transparent; border:1px solid rgba(244,239,224,0.4); border-radius:4px;
    color:#F4EFE0; font-size:12px; padding:3px 6px; font-family:'IBM Plex Mono',monospace;
  }
  .header-date-input::-webkit-calendar-picker-indicator{filter:invert(1); opacity:0.7;}

  .plans-header-row{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:6px;}
  .plans-title{color:#F4EFE0; font-size:24px;}
  .plans-header-actions{display:flex; align-items:center; gap:8px; position:relative;}
  .btn.plans-header-btn{background:transparent; color:#F4EFE0; border-color:rgba(244,239,224,0.5);}
  .btn.plans-header-btn:hover{background:rgba(244,239,224,0.15);}
  .menu-wrap{position:relative;}
  .dropdown-menu{
    position:absolute; top:calc(100% + 6px); right:0; background:#fff; border:1px solid var(--line);
    border-radius:8px; box-shadow:var(--shadow); min-width:170px; z-index:20; overflow:hidden;
  }
  .dropdown-menu button{
    display:block; width:100%; text-align:left; padding:10px 14px; background:none; border:none;
    cursor:pointer; font-size:13px; color:var(--ink); font-family:'Work Sans',sans-serif;
  }
  .dropdown-menu button:hover{background:var(--paper-dark);}
  .dropdown-menu button + button{border-top:1px solid var(--line-soft);}

  .plans-list{display:flex; flex-direction:column; gap:14px; padding:18px 0 60px;}
  .plan-card{
    display:flex; gap:14px; background:#F7F2E6; border:1px solid var(--line); border-radius:10px;
    padding:14px; box-shadow:var(--shadow); cursor:pointer; transition:box-shadow .15s;
  }
  .plan-card:hover{box-shadow:0 4px 14px rgba(0,0,0,0.1);}
  .plan-card-thumb{
    flex:none; width:68px; height:68px; border-radius:8px; overflow:hidden; background:var(--pine-tint);
    display:flex; align-items:center; justify-content:center;
  }
  .plan-card-thumb img{width:100%; height:100%; object-fit:cover;}
  .plan-card-thumb .glyph{font-size:28px;}
  .plan-card-body{flex:1; min-width:0;}
  .plan-card-title-row{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .plan-card-title{font-family:'Oswald',sans-serif; font-weight:600; font-size:17px; color:var(--pine-deep);}
  .plan-card-actions{display:flex; gap:4px; flex:none;}
  .plan-card-icon-btn{
    background:none; border:1px solid var(--line); border-radius:4px; padding:3px 7px; cursor:pointer; font-size:12px;
  }
  .plan-card-icon-btn:hover{background:var(--paper-dark);}
  .plan-card-sub{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-top:2px;}
  .plan-card-dates{font-size:12px; color:var(--ink); margin-top:6px;}
  .plan-card-nodate{font-style:italic; color:var(--ink-soft);}
  .plan-card-stats{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}

  /* "+ Create" as a plain header button — unlike the old dropdown-menu, a
     button has no overflowing content of its own, so it isn't at risk of
     being clipped by the header's overflow rules the way that was. */
  .plans-header-btn-solid{
    background:var(--rust); color:#F4EFE0; border-color:var(--rust); font-size:12px; padding:6px 12px;
  }
  .plans-header-btn-solid:hover{ background:#a4501f; }
  /* Maintenance Mode — deliberately loud so it can never be silently left on */
  .maintenance-banner{
    position:sticky; top:0; z-index:50; background:var(--rust); color:#F4EFE0;
    text-align:center; padding:8px 14px; font-size:12.5px; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap;
  }
  .maintenance-banner button{
    background:rgba(255,255,255,0.2); color:#F4EFE0; border:1px solid rgba(255,255,255,0.5);
    border-radius:4px; padding:3px 10px; font-size:11px; cursor:pointer;
  }
  .maintenance-banner button:hover{ background:rgba(255,255,255,0.32); }
  .maintenance-toggle-box{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    margin-top:16px; padding-top:16px; border-top:1px dashed var(--line);
  }
  .maintenance-toggle-title{font-family:'Oswald',sans-serif; font-weight:600; font-size:14px; color:var(--pine-deep);}
  .maintenance-switch{ position:relative; display:inline-block; width:44px; height:24px; flex:none; }
  .maintenance-switch input{ opacity:0; width:0; height:0; }
  .maintenance-switch-track{
    position:absolute; cursor:pointer; inset:0; background:var(--line); border-radius:24px; transition:.15s;
  }
  .maintenance-switch-track::before{
    content:""; position:absolute; height:18px; width:18px; left:3px; bottom:3px;
    background:#fff; border-radius:50%; transition:.15s;
  }
  .maintenance-switch input:checked + .maintenance-switch-track{ background:var(--rust); }
  .maintenance-switch input:checked + .maintenance-switch-track::before{ transform:translateX(20px); }
</style>

        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;

      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;

      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {

              bytes.push(b & 0xff);

          }

    await storeSet('user-directory', state.userDirectory, true);
  }
  // Remember who had automatic edit access under the OLD model — both
  // legacy global 'admin' AND 'developer' (Developer used to auto-edit every
  // trip; that stopped being true once we made it require being personally
  // added, same as anyone). Existing trips use this once to grandfather
  // these people in as THAT trip's admin, so nobody already using the app
  // loses edit access to a trip they were already editing.
  state.legacyGlobalAdmins = state.userDirectory
    .filter(u=>u.level==='admin' || u.level==='developer')
    .map(u=>String(u.name||'').trim().toLowerCase());
  let migrated = false;
  state.userDirectory.forEach(u=>{ if(u.level==='admin'){ u.level='member'; migrated=true; } });
  if(migrated) saveUserDirectory();
}
function countDevelopers(){
  return state.userDirectory.filter(u=>u.level==='developer').length;
}
function saveUserDirectory(){
  storeSet('user-directory', state.userDirectory, true);
}
// Removes a uid from the server-side developer allowlist. Called on demotion
// or deletion of a Developer directory entry — without this, changing
// someone's label in Manage Access wouldn't actually revoke the elevated
// Firestore-rules access they were granted the first time they logged in.
async function revokeDeveloperUid(uidToRevoke){
  const accessControl = await storeGet('access-control', true);
  if(!accessControl || !Array.isArray(accessControl.developerUids)) return;
  const idx = accessControl.developerUids.indexOf(uidToRevoke);
  if(idx !== -1){
    accessControl.developerUids.splice(idx, 1);
    await storeSet('access-control', accessControl, true);
  }
}
async function grantDeveloperUid(uidToGrant){
  const accessControl = (await storeGet('access-control', true)) || {developerUids:[]};
  if(!Array.isArray(accessControl.developerUids)) accessControl.developerUids = [];
  if(!accessControl.developerUids.includes(uidToGrant)){
    accessControl.developerUids.push(uidToGrant);
    await storeSet('access-control', accessControl, true);
  }
}

function ensureTripShape(t){
  // backfill fields for trips saved before photo/location/startDate/catchLog/purchased/activities/balanceForward existed
  if(t.photo === undefined) t.photo = null;
  if(!t.location) t.location = {name:'', mapsUrl:''};
  if(t.startDate === undefined) t.startDate = '';
  if(!t.catchLog) t.catchLog = {};
  if(t.catchLogEnabled === undefined) t.catchLogEnabled = false;
  if(t.costsEnabled === undefined) t.costsEnabled = false;
  if(!Array.isArray(t.memberUids)) t.memberUids = [];
  if(!Array.isArray(t.adminUids)) t.adminUids = [];
  // Guard every array field — a trip that's ever been hand-edited, partially
  // imported, or hit a save error in the past could have one of these missing
  // or containing a stray null/undefined entry, and any of that used to crash
  // the WHOLE My Plans list (every trip's card math runs on load), not just
  // that one trip.
  if(!Array.isArray(t.costs)) t.costs = [];
  if(!Array.isArray(t.roles)) t.roles = [];
  if(!Array.isArray(t.people)) t.people = [];
  t.people = t.people.filter(p=>p);
  if(!Array.isArray(t.days)) t.days = [];
  t.days = t.days.filter(d=>d);
  if(!Array.isArray(t.shopping)) t.shopping = [];
  t.shopping = t.shopping.filter(i=>i);
  t.shopping.forEach(i=>{ if(i.purchased===undefined) i.purchased=false; });
  if(!Array.isArray(t.activities)) t.activities = [];
  t.activities = t.activities.filter(a=>a);
  t.activities.forEach((a,i)=>{
    if(a.type===undefined) a.type = 'activity';
    if(a.endTime===undefined) a.endTime = '';
    if(!a.location) a.location = {name:'', mapsUrl:''};
    if(a.order===undefined) a.order = i;
  });
  if(!t.balanceForward) t.balanceForward = {label:'Balance FW', amount:0};
  if(!Array.isArray(t.documents)) t.documents = [];
  t.documents = t.documents.filter(d=>d);
  if(!Array.isArray(t.bookings)) t.bookings = [];
  t.bookings = t.bookings.filter(b=>b);
  if(!Array.isArray(t.flights)) t.flights = [];
  t.flights = t.flights.filter(f=>f);
  // One-time per-trip migration: make sure EVERY legacy admin/developer still
  // listed in this trip's People actually has isTripAdmin:true, correcting
  // both never-set (undefined) and incorrectly-saved (false) cases — not
  // just as a fallback when NOBODY has admin, since one correctly-migrated
  // person on a trip was masking others who weren't. Runs once per trip
  // (marked and persisted below) so it can never undo a later deliberate
  // demotion — after this migration, isTripAdmin is fully self-governed.
  if(!t._legacyAdminMigrated){
    t.people.forEach(p=>{
      const key = String(p.name||'').trim().toLowerCase();
      if((state.legacyGlobalAdmins||[]).includes(key)) p.isTripAdmin = true;
      else if(p.isTripAdmin === undefined) p.isTripAdmin = false;
    });
    t._legacyAdminMigrated = true;
    t._needsMigrationSave = true; // loadTripsAndTrip() persists this exactly once
  }
  return t;
}

function activitiesForDay(t, dayId){
  return t.activities
    .filter(a=>a.dayId===dayId)
    .slice()
    .sort((a,b)=> (a.order||0) - (b.order||0));
}
function moveActivity(t, id, direction){
  // direction: -1 (up) or 1 (down) — swaps order with the neighbour in the same day
  const a = findActivity(t, id);
  if(!a) return;
  const siblings = activitiesForDay(t, a.dayId);
  const idx = siblings.findIndex(x=>x.id===id);
  const swapIdx = idx + direction;
  if(swapIdx < 0 || swapIdx >= siblings.length) return;
  const b = siblings[swapIdx];
  const tmp = a.order; a.order = b.order; b.order = tmp;
}

/* A day's date is always derived from the trip's start date + its position
   in the list — no per-day date field to keep in sync. */
function toISODateLocal(d){
  // Manual YYYY-MM-DD using LOCAL date parts — d.toISOString() converts to
  // UTC first, which silently shifts the date back a day for any timezone
  // ahead of UTC (e.g. Australia). This avoids that entirely.
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function dayDateFor(trip, index){
  if(!trip.startDate) return '';
  const d = new Date(trip.startDate + 'T00:00:00');
  if(isNaN(d.getTime())) return '';
  d.setDate(d.getDate() + index);
  return toISODateLocal(d);
}
function tripEndDate(trip){
  if(!trip.startDate || !trip.days.length) return '';
  return dayDateFor(trip, trip.days.length - 1);
}

/* ============================= Derived calculations ============================= */
function groupShopping(trip, key){
  const groups = {};
  trip.shopping.forEach(item=>{
    const g = (item[key] && item[key].trim()) ? item[key].trim() : (key==='store' ? 'Store TBD' : 'Uncategorised');
    if(!groups[g]) groups[g] = {label:g, items:[], budget:0, actual:0};
    const qty = Number(item.qty)||0;
    const unit = Number(item.unitActual)||0;
    const budget = Number(item.budget)||0;
    const actual = qty * unit;
    groups[g].items.push(item);
    groups[g].budget += budget;
    groups[g].actual += actual;
  });
  return Object.values(groups);
}

function shoppingTotals(trip){
  let budget=0, actual=0;
  trip.shopping.forEach(item=>{
    budget += Number(item.budget)||0;
    actual += (Number(item.qty)||0) * (Number(item.unitActual)||0);
  });
  return {budget, actual};
}

function costLinesTotals(trip){
  let budget=0, actual=0;
  trip.costs.forEach(c=>{ budget += Number(c.budget)||0; actual += Number(c.actual)||0; });
  return {budget, actual};
}

function grandTotals(trip){
  const c = costLinesTotals(trip);
  const s = shoppingTotals(trip);
  return {budget: c.budget + s.budget, actual: c.actual + s.actual};
}

function collectedTotal(trip){
  const fromPeople = trip.people.reduce((sum,p)=> sum + (Number(p.paid)||0), 0);
  const forward = (trip.balanceForward && Number(trip.balanceForward.amount)) || 0;
  return fromPeople + forward;
}

function owedFor(trip, person){
  const role = trip.roles.find(r=>r.id===person.roleId);
  return role ? Number(role.amount)||0 : 0;
}

// Short 1-2 letter code per role for compact display — e.g. "Vehicle
// user" -> V, "Passenger" -> P. Falls back to two letters if the first
// letter is already taken by another role.
function roleAbbreviations(roles){
  const used = {};
  const map = {};
  roles.forEach(r=>{
    const label = (r.label||'?').trim();
    let abbr = (label.charAt(0) || '?').toUpperCase();
    if(used[abbr] && used[abbr] !== r.id){
      abbr = label.slice(0,2).toUpperCase() || abbr;
    }
    used[abbr] = r.id;
    map[r.id] = abbr;
  });
  return map;
}

/* ============================= Swipe-to-switch-tabs ============================= */
/* Attached once to #app itself (never replaced by render(), only its
   innerHTML is), so this survives every re-render. Horizontal swipes move
   between tabs; anything that isn't a clean, mostly-horizontal, fast-enough
   gesture is ignored so normal vertical scrolling and text selection still
   work as expected. */
function setupSwipeNav(){
  const app = document.getElementById('app');
  let startX = 0, startY = 0, startTime = 0, active = false;
  const SWIPE_MIN_DISTANCE = 60;   // px
  const SWIPE_MAX_OFF_AXIS = 70;   // px of vertical drift still counts as "horizontal"
  const SWIPE_MAX_TIME = 700;      // ms

  app.addEventListener('touchstart', e=>{
    if(e.touches.length !== 1) { active = false; return; }
    const tag = (e.target.tagName||'').toLowerCase();
    if(tag === 'input' || tag === 'textarea' || tag === 'select'){ active = false; return; }
    if(e.target.closest('.table-scroll')){ active = false; return; } // let the table handle its own sideways scroll
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY; startTime = Date.now();
    active = true;
  }, {passive:true});

  app.addEventListener('touchend', e=>{
    if(!active || !state.trip) return;
    active = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    const dt = Date.now() - startTime;
    if(dt > SWIPE_MAX_TIME) return;
    if(Math.abs(dy) > SWIPE_MAX_OFF_AXIS) return;
    if(Math.abs(dx) < SWIPE_MIN_DISTANCE) return;
    swipeToTab(dx < 0 ? 1 : -1);
  }, {passive:true});
}
function swipeToTab(direction){
  const idx = TAB_ORDER.indexOf(state.tab);
  const next = idx + direction;
  if(next < 0 || next >= TAB_ORDER.length) return;
  state.tab = TAB_ORDER[next];
  state.showNewTripModal = false;
  state.showImportModal = false;
  render();
}

// Fires once on load (after Firebase Auth checks any persisted session) and
// again on every sign-in/sign-out — this is what drives which gate screen
// shows, not a one-shot check like the old localStorage version.
async function handleAuthStateChange(user){
  state.authUser = user;
  if(!user || !user.emailVerified){
    // Signed out, OR signed in but hasn't clicked the verification link yet
    // — either way, no usable identity. render() decides which of the two
    // gate screens to show based on state.authUser.
    state.identity = null;
    ADMIN = false;
    state.loaded = true;
    render();

  }
  state.identity = identityFromAuthUser(user);
  await loadUserDirectory();

// Tracks which signed-in uid the reconciliation pass (in loadTripsAndTrip)
// has already run for this session — null means "not yet done this session".
let reconciledForUid = null;

async function loadTripsAndTrip(){
  showLoading('Loading your plans…', loadTripsAndTrip);
  const idx = await storeGet('trips-index', true);
  state.tripsIndex = idx || [];
  // Fetch every trip's full data up front — the My Plans list needs each
  // one's Budget/Actual/Surplus, and this means opening a trip afterwards
  // is instant (already cached) instead of a second network round-trip.
  // Throttled to 4 at a time rather than all-at-once — see mapWithConcurrency.
  const fullTrips = await mapWithConcurrency(state.tripsIndex, 4, ix => storeGet('trip:'+ix.id, true));
  state.plansCache = {};
  state.tripsIndex.forEach((ix, i) => {
    if(fullTrips[i]) state.plansCache[ix.id] = ensureTripShape(fullTrips[i]);
  });

  // Persist the one-time legacy-admin migration for any trip that just got
  // corrected — without this, the fix would re-derive correctly every load
  // but never actually stick, and would keep silently overriding any future
  // deliberate demotion since it'd never be marked as already-migrated.
  const needingSave = Object.values(state.plansCache).filter(t=>t._needsMigrationSave);
  if(needingSave.length){
    await Promise.all(needingSave.map(t=>{
      delete t._needsMigrationSave;
      return storeSet('trip:'+t.id, t, true);
    }));
  }

  // Arrived via a trip-specific Invite link — join that trip as a Member
  // (if not already in it) BEFORE the membership filter below runs, so it's
  // guaranteed to show up instead of landing on an empty "no trips" screen.
  let justJoinedTripId = null;
  const pendingJoinTripId = getPendingJoinTripId();
  if(pendingJoinTripId && state.plansCache[pendingJoinTripId]){
    const t = state.plansCache[pendingJoinTripId];
    const myName = String(state.identity.name||'').trim().toLowerCase();
    const already = t.people.some(p=>String(p.name||'').trim().toLowerCase()===myName);
    const alreadyHasUid = (t.memberUids||[]).includes(state.identity.uid);
    if(!already || !alreadyHasUid){
      if(!already){
        t.people.push({id:uid(), name:state.identity.name, phone:state.identity.phone||'', roleId:(t.roles[0]&&t.roles[0].id)||'', paid:0, isTripAdmin:false});
      }
      if(!alreadyHasUid){
        if(!Array.isArray(t.memberUids)) t.memberUids = [];
        t.memberUids.push(state.identity.uid);
      }
      await storeSet('trip:'+pendingJoinTripId, t, true);
    }
    justJoinedTripId = pendingJoinTripId;
  }
  setPendingJoinTripId(null);

  // Reconcile every OTHER trip too — not just one from an invite link.
  // Anyone added by name before they had an account (manual add, or a trip
  // migrated from the old backend) needs their real uid recorded in
  // memberUids the first time they actually sign in themselves; security
  // rules check memberUids, not names, so without this their write access
  // would silently never work despite being listed as a person on the trip.
  //
  // This whole pass only needs to run ONCE per signed-in session — it's
  // pure bookkeeping, not something that changes on every reload. Skipping
  // it on repeat calls (manual refresh, "Try again", re-opening the join
  // box) noticeably speeds up everything after the very first login.
  if(reconciledForUid !== state.identity.uid){
  const myNameLower = String(state.identity.name||'').trim().toLowerCase();
  const toReconcile = Object.values(state.plansCache).filter(t=>{
    if(t.id === justJoinedTripId) return false; // already handled above
    const named = t.people.some(p=>String(p.name||'').trim().toLowerCase()===myNameLower);
    const hasUid = (t.memberUids||[]).includes(state.identity.uid);
    return named && !hasUid;
  });
  if(toReconcile.length){
    await Promise.all(toReconcile.map(t=>{
      if(!Array.isArray(t.memberUids)) t.memberUids = [];
      t.memberUids.push(state.identity.uid);
      return storeSet('trip:'+t.id, t, true);
    }));
  }

  // Same idea, but for global Developer status: meta/user-directory is
  // still matched by name (unchanged), but security rules need a uid to
  // check against, so mirror any name-matched Developer into a separate
  // uid-keyed list the rules can actually read. The uid is also written
  // onto the directory entry itself, so Manage Access can look it up later
  // to properly revoke access-control on a demotion or removal — not just
  // update the label.
  const directory = state.userDirectory;
  const myDirIndex = directory.findIndex(u=>String(u.name||'').trim().toLowerCase()===myNameLower);
  if(myDirIndex !== -1){
    let directoryChanged = false;
    if(directory[myDirIndex].uid !== state.identity.uid){
      directory[myDirIndex].uid = state.identity.uid;
      directoryChanged = true;
    }
    if(directory[myDirIndex].level==='developer'){
      const accessControl = (await storeGet('access-control', true)) || {developerUids:[]};
      if(!Array.isArray(accessControl.developerUids)) accessControl.developerUids = [];
      if(!accessControl.developerUids.includes(state.identity.uid)){
        accessControl.developerUids.push(state.identity.uid);
        await storeSet('access-control', accessControl, true);
      }
    }
    if(directoryChanged) await storeSet('user-directory', directory, true);
  }
  reconciledForUid = state.identity.uid;
  } // end once-per-session reconciliation guard

  // Everyone — Developer included — only sees trips they're actually part of
  // (their name appears in that trip's People list), UNLESS Developer has
  // deliberately switched on Maintenance Mode for troubleshooting. That's an
  // explicit, visible, off-by-default opt-in — not a silent bypass.
  if(!(DEVELOPER && state.developerMaintenanceMode)){
    const myName = String(state.identity.name||'').trim().toLowerCase();
    state.tripsIndex = state.tripsIndex.filter(ix=>{
      const t = state.plansCache[ix.id];
      return t && t.people.some(p=>String(p.name||'').trim().toLowerCase()===myName);
    });
    const allowedIds = new Set(state.tripsIndex.map(ix=>ix.id));
    Object.keys(state.plansCache).forEach(id=>{ if(!allowedIds.has(id)) delete state.plansCache[id]; });
  }

  state.screen = 'plans';
  state.trip = null;
  state.loaded = true;

  if(justJoinedTripId && state.plansCache[justJoinedTripId]){
    openTrip(justJoinedTripId); // jump straight into the trip they were invited to, skip My Plans
    return;
  }
  render();
}

function openTrip(id){
  const t = state.plansCache[id];
  if(!t) return;
  ensureTripShape(t); // safety net — normalizes any trip object that landed in the cache without going through the normal load path (e.g. a freshly duplicated trip)
  state.trip = t;
  computeAdminForOpenTrip(); // ADMIN now reflects whether I can edit THIS trip specifically
  state.screen = 'trip';
  state.tab = 'overview';
  storeSet('last-trip-id', id, false); // local convenience only, not relied on for navigation anymore
  render();
}
function backToPlans(){
  state.trip = null;
  ADMIN = DEVELOPER; // no specific trip is open — outside a trip, only Developer counts as "admin"
  state.screen = 'plans';
  render();
}

let loadingRetryTimer = null;
function showLoading(msg, onRetry){
  clearTimeout(loadingRetryTimer);
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="loading-screen">
      <div class="loading-spinner"></div>
      <div class="loading-msg">${escapeHtml(msg||'Loading…')}</div>
      <div class="loading-retry" id="loadingRetry" hidden>
        <div class="section-note">This is taking longer than usual — your connection or the backend may be slow right now.</div>
        <button class="btn ghost sm" id="btnLoadingRetry">↻ Try again</button>
      </div>
    </div>
  `;
  const retryBtn = document.getElementById('btnLoadingRetry');
  if(retryBtn && onRetry) retryBtn.addEventListener('click', onRetry);
  // Don't cut the request off early — Apps Script cold-starts can
  // legitimately take a while — but don't leave someone staring at a bare
  // spinner wondering if it's frozen, either. Surface a way out after 6s.
  if(onRetry){
    loadingRetryTimer = setTimeout(()=>{
      const el = document.getElementById('loadingRetry');
      if(el) el.hidden = false;
    }, 6000);
  }
}

// Runs async work over `items` with at most `limit` requests in flight at
// once, instead of firing every trip's fetch simultaneously — Google Apps
// Script has real concurrency limits, and blasting it with N-at-once
// requests (one per trip) is a likely cause of stalls that then sit behind
// the hard timeout looking exactly like a freeze.
async function mapWithConcurrency(items, limit, fn){
  const results = new Array(items.length);
  let next = 0;
  async function worker(){
    while(next < items.length){
      const i = next++;
      results[i] = await fn(items[i], i);
    }
  }
  await Promise.all(Array.from({length: Math.min(limit, items.length)}, worker));
  return results;
}

// Prevents the exact "screen freezes" bug: these buttons live in a modal
// that's separate from the page content underneath, so they don't visually
// disable themselves while a network call is in flight — without this guard,
// an impatient double-tap fires the action twice, which not only creates a
// duplicate but makes the real wait even longer (two round-trips instead of one).
let actionInProgress = false;

// Anyone signed in can create a trip — they automatically become ITS admin
// and can invite others / promote them within it. There's no global "Admin"
// gate here anymore, only Developer (which can always create too, obviously).
async function createTrip(name, type, startDate, numDays, currency){
  if(!state.identity || actionInProgress) return;
  actionInProgress = true;
  try{
    showLoading('Creating trip…');
    const t = newTrip(name, type, currency);
    t.startDate = startDate || '';
    const n = Math.max(1, Number(numDays)||1);
    t.days = Array.from({length:n}, (_,i)=>({id:uid(), label:'Day '+(i+1), breakfast:'', lunch:'', dinner:''}));
    // The creator is automatically added as a member AND this trip's admin.
    t.people.push({id:uid(), name:state.identity.name, phone:state.identity.phone||'', roleId:(t.roles[0]&&t.roles[0].id)||'', paid:0, isTripAdmin:true});
    // memberUids/adminUids are flat uid arrays kept alongside `people` —
    // Firestore security rules can check "is my uid in this array" cheaply,
    // but can't efficiently check "does this array of objects contain one
    // whose isTripAdmin field is true and whose uid matches mine". These
    // exist purely so the rules (not just the client) can enforce access.
    t.memberUids = [state.identity.uid];
    t.adminUids = [state.identity.uid];
    // Brand new trip, created entirely under the per-trip-admin system —
    // never subject to the legacy grandfather-in migration (that's only for
    // trips that predate this system; applying it here would silently
    // override any deliberate admin decisions made on this trip later).
    t._legacyAdminMigrated = true;
    state.tripsIndex.push({id:t.id, name:t.name, type:t.type, createdAt:t.createdAt});
    state.plansCache[t.id] = t;
    await Promise.all([
      storeSet('trips-index', state.tripsIndex, true),
      storeSet('trip:'+t.id, t, true),
    ]);
    state.showNewTripModal = false;
    state.inviteForTripId = t.id;
    state.showInviteModal = true; // land inside the new trip with its invite already up — nothing extra to go find
    openTrip(t.id);
  } finally {
    actionInProgress = false;
  }
}

async function duplicateTripById(id){
  const src = state.plansCache[id];
  if(!src || !canEditTrip(src) || actionInProgress) return;
  const name = prompt('Name for the new trip:', src.name + ' (Copy)');
  if(!name || !name.trim()) return;
  actionInProgress = true;
  try{
    showLoading('Duplicating trip…');

    // Remap role and day IDs so the copy doesn't share references with the
    // original — everything that points at a role or day needs the NEW id.
    const roleIdMap = {};
    const newRoles = src.roles.map(r=>{
      const newId = uid();
      roleIdMap[r.id] = newId;
      return {...r, id:newId};
    });
    const dayIdMap = {};
    const newDays = src.days.map(d=>{
      const newId = uid();
      dayIdMap[d.id] = newId;
      return {...d, id:newId};
    });
    const myName = String(state.identity.name||'').trim().toLowerCase();

    const newTripObj = {
      id: uid(),
      name: name.trim(),
      type: src.type,
      currency: src.currency || DEFAULT_CURRENCY,
      createdAt: Date.now(),
      photo: src.photo,
      location: {...src.location},
      startDate: src.startDate,
      costs: src.costs.map(c=>({...c, id:uid(), actual:0})),          // budgets copied, actual spend reset
      roles: newRoles,
      // who's coming is copied, payments reset — and admin resets too: only
      // whoever duplicated it is admin on the copy, matching "creator becomes admin".
      people: src.people.map(p=>({...p, id:uid(), roleId: roleIdMap[p.roleId]||'', paid:0, isTripAdmin: String(p.name||'').trim().toLowerCase()===myName})),
      days: newDays,                                                   // meal plan copied as-is
      shopping: src.shopping.map(s=>({...s, id:uid(), unitActual:0, purchased:false})), // list copied, shopping progress reset
      catchLog: {},                                                    // catch counts are per-trip, start fresh
      catchLogEnabled: !!src.catchLogEnabled,                          // the on/off preference carries over, the data doesn't
      costsEnabled: !!src.costsEnabled,                                // same for the Costs toggle
      activities: src.activities.map(a=>({...a, id:uid(), dayId: dayIdMap[a.dayId]||'', location:{...(a.location||{name:'',mapsUrl:''})}})),
      balanceForward: {label:'Balance FW', amount:0}, // rollover credit is specific to the trip it came from — starts fresh
      documents: [],   // travel documents are trip-instance-specific (expiry dates, scans) — start fresh, like Catch Log
      bookings: [],    // same — a copy's bookings/confirmations are its own, not the original's
      flights: [],     // same — a copy's flights are its own, not the original's
      _legacyAdminMigrated: true, // explicit admin assignment above — never subject to the legacy grandfather-in migration
    };

    state.tripsIndex.push({id:newTripObj.id, name:newTripObj.name, type:newTripObj.type, createdAt:newTripObj.createdAt});
    state.plansCache[newTripObj.id] = newTripObj;
    await Promise.all([
      storeSet('trips-index', state.tripsIndex, true),
      storeSet('trip:'+newTripObj.id, newTripObj, true),
    ]);
    render(); // stay on My Plans — show the new card alongside the original
  } finally {
    actionInProgress = false;
  }
}

async function deleteTripById(id){
  const t = state.plansCache[id];
  if(!t || !canEditTrip(t)) return;
  if(!confirm('Delete "'+t.name+'"? This cannot be undone.')) return;
  state.tripsIndex = state.tripsIndex.filter(x=>x.id!==id);
  delete state.plansCache[id];
  await storeSet('trips-index', state.tripsIndex, true);
  if(state.trip && state.trip.id===id){ state.trip = null; ADMIN = DEVELOPER; state.screen = 'plans'; }
  render();
}

/* ============================= Rendering ============================= */
function render(){
  const app = document.getElementById('app');
  if(!state.loaded){ app.innerHTML = ''; return; }
  if(!state.identity){
    if(state.authUser && !state.authUser.emailVerified){
      app.innerHTML = renderVerifyEmailGate();
      bindVerifyEmailGate();
      return;
    }
    app.innerHTML = renderIdentityGate();
    bindIdentityGate();
    return;
  }

  if(state.screen === 'account'){
    renderAccountScreen();
  } else if(state.screen === 'trip' && state.trip){
    renderTripScreen();
  } else {
    renderPlansScreen();
  }
  mountModals();
  renderMaintenanceBanner();
}

function renderMaintenanceBanner(){
  const existing = document.getElementById('maintenanceBanner');
  if(existing) existing.remove();
  if(DEVELOPER && state.developerMaintenanceMode){
    const banner = document.createElement('div');
    banner.id = 'maintenanceBanner';
    banner.className = 'maintenance-banner';
    banner.innerHTML = `🔧 Maintenance Mode is ON — you can see and edit every trip. <button id="btnEndMaintenance">Turn off</button>`;
    document.body.insertBefore(banner, document.body.firstChild);
    document.getElementById('btnEndMaintenance').addEventListener('click', ()=>{
      state.developerMaintenanceMode = false;
      loadTripsAndTrip();
    });
  }
}

function mountModals(){
  // Always clear out any previously-mounted modal first. Modals live outside
  // #app (appended directly to body) so a normal render() never touches
  // them — without this, a stale one from an earlier action can be left
  // sitting in the DOM invisibly. Since a modal backdrop covers the entire
  // screen, a leftover one silently eats every click from then on, which
  // looks exactly like the app being frozen even though it's fine underneath.
  document.querySelectorAll('.modal-backdrop').forEach(el=>el.remove());

  const t = state.trip;
  if(state.showNewTripModal && state.identity){
    const wrap = document.createElement('div');
    wrap.innerHTML = renderNewTripModal();
    document.body.appendChild(wrap.firstElementChild);
    bindNewTripModal();
  }
  if(state.showImportModal && t && canEditTrip(t)){
    const wrap2 = document.createElement('div');
    wrap2.innerHTML = renderImportModal();
    document.body.appendChild(wrap2.firstElementChild);
    bindImportModal(t);
  }
  if(state.showMigrateModal && DEVELOPER){
    const wrapM = document.createElement('div');
    wrapM.innerHTML = renderMigrateModal();
    document.body.appendChild(wrapM.firstElementChild);
    bindMigrateModal();
  }
  if(state.showManageAccessModal && DEVELOPER){
    const wrap3 = document.createElement('div');
    wrap3.innerHTML = renderManageAccessModal();
    document.body.appendChild(wrap3.firstElementChild);
    bindManageAccessModal();
  }
  if(state.showInviteModal && state.identity){
    const wrap4 = document.createElement('div');
    wrap4.innerHTML = renderInviteModal();
    document.body.appendChild(wrap4.firstElementChild);
    bindInviteModal();
  }
}

    const statusEl = document.getElementById('manualJoinStatus');
    if(!raw){ statusEl.textContent = 'Paste the invite link (or just the trip id) first.'; statusEl.style.color = 'var(--danger)'; return; }
    // Accept either a full invite URL (extract ?t=...) or a bare trip id.
    let tripId = raw;
    try{
      const parsed = new URL(raw);
      const t = parsed.searchParams.get('t');
      if(t) tripId = t;
    }catch(e){ /* not a URL — treat the whole input as a bare trip id */ }
    setPendingJoinTripId(tripId);
    statusEl.textContent = 'Joining…';
    statusEl.style.color = 'var(--ink-soft)';
    await loadTripsAndTrip();
  });

  document.querySelectorAll('.plan-card').forEach(card=>{
    const id = card.dataset.plan;
    card.addEventListener('click', (e)=>{
      if(e.target.closest('.plan-card-actions')) return; // icon clicks handled separately below

    if(acc) acc.addEventListener('click', (e)=>{
      e.stopPropagation();

      state.screen = 'account';
      render();

    const dup = card.querySelector('.plan-duplicate-btn');
    if(dup) dup.addEventListener('click', (e)=>{ e.stopPropagation(); duplicateTripById(id); });
    const del = card.querySelector('.plan-delete-btn');
    if(del) del.addEventListener('click', (e)=>{ e.stopPropagation(); deleteTripById(id); });
  });
}

// Free place search (OpenStreetMap Nominatim) — no API key needed. Used for
// the Itinerary location field's type-ahead suggestions. Each call aborts
// the previous in-flight one, so fast typing doesn't leave stale requests
// racing to update the dropdown out of order.
let placeSearchAbortController = null;
async function searchPlacesNominatim(query){
  if(placeSearchAbortController) placeSearchAbortController.abort();
  placeSearchAbortController = new AbortController();
  try{
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=5&q=' + encodeURIComponent(query);
    const res = await fetch(url, { signal: placeSearchAbortController.signal });
    if(!res.ok) return [];
    const data = await res.json();
    return data.map(item => ({ name: item.display_name, lat: item.lat, lon: item.lon }));
  }catch(e){
    if(e.name === 'AbortError') return null; // superseded by a newer keystroke — caller should ignore
    return [];
  }
}

function escapeHtml(s){
  return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- Cover photo ---------- */
function handlePhotoUpload(e, t){
  if(!ADMIN) return;
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  if(!file.type.startsWith('image/')){ alert('Please choose an image file.'); return; }
  const reader = new FileReader();
  reader.onload = function(ev){
    const img = new Image();
    img.onload = async function(){
      const MAX_DIM = 1000;
      let w = img.width, h = img.height;
      if(w > h && w > MAX_DIM){ h = Math.round(h * MAX_DIM / w); w = MAX_DIM; }
      else if(h > MAX_DIM){ w = Math.round(w * MAX_DIM / h); h = MAX_DIM; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.75);

      const thumb = document.getElementById('coverThumb');
      if(thumb) thumb.style.opacity = '0.5';
      const result = await backendUploadPhoto(t.id, dataUrl);
      if(thumb) thumb.style.opacity = '1';
      if(!result.ok){
        alert('Photo upload failed (' + result.error + '). Check the backend connection and try again.');
        return;
      }
      t.photo = result.url;
      scheduleSave();
      render();
    };
    img.onerror = function(){ alert('Could not read that image — try a different file.'); };
    img.src = ev.target.result;
  };
  reader.onerror = function(){ alert('Could not read that file.'); };
  reader.readAsDataURL(file);
}

/* ---------- Travel Document scans ---------- */
function handleDocumentUpload(e, t, docId){
  if(!ADMIN) return;
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const docObj = findDocument(t, docId);
  if(!docObj) return;
  const isPdf = file.type === 'application/pdf';
  if(!isPdf && !file.type.startsWith('image/')){ alert('Please choose an image or PDF file.'); return; }

  async function finish(dataUrl){
    const result = await backendUploadDocument(t.id, docObj.id, dataUrl);
    if(!result.ok){
      alert('Upload failed (' + result.error + '). Check the backend connection and try again.');
      return;
    }
    docObj.fileUrl = result.url;
    scheduleSave();
    renderPanel();
  }

  const reader = new FileReader();
  reader.onload = function(ev){
    if(isPdf){
      finish(ev.target.result); // PDFs are uploaded as-is — no client-side resize possible
      return;
    }
    const img = new Image();
    img.onload = function(){
      const MAX_DIM = 1400; // a bit larger than the cover photo so a scanned document stays legible
      let w = img.width, h = img.height;
      if(w > h && w > MAX_DIM){ h = Math.round(h * MAX_DIM / w); w = MAX_DIM; }
      else if(h > MAX_DIM){ w = Math.round(w * MAX_DIM / h); h = MAX_DIM; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      finish(canvas.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = function(){ alert('Could not read that image — try a different file.'); };
    img.src = ev.target.result;
  };
  reader.onerror = function(){ alert('Could not read that file.'); };
  reader.readAsDataURL(file);
}

/* ---------- Flight status (via Cloud Function -> AeroDataBox) ---------- */
// The API key never touches this file — getFlightStatus is a Cloud Function
// that holds it server-side. See functions/index.js.
async function checkFlightStatus(t, flightId){
  const f = findFlight(t, flightId);
  if(!f) return;
  if(!f.flightNumber || !f.date){ alert('Add a flight number and date first.'); return; }
  f.status = 'Checking…';
  renderPanel();
  try{
    const call = httpsCallable(functionsClient, 'getFlightStatus');
    const res = await call({flightNumber: f.flightNumber, date: f.date});
    const d = res.data || {};
    if(d.found === false){
      f.status = 'Not found';
      f.statusDetail = null;
    }else{
      f.status = d.status || 'Unknown';
      f.statusDetail = d;
    }
  }catch(e){
    f.status = 'Check failed';
    f.statusDetail = { error: String(e && e.message || e) };
  }
  f.statusCheckedAt = Date.now();
  scheduleSave();
  renderPanel();
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d.getTime())) return null;
  return Math.round((d.getTime() - new Date(new Date().toDateString()).getTime()) / 86400000);
}
function expiryBadge(dateStr){
  if(!dateStr) return '';
  const days = daysUntil(dateStr);
  if(days === null) return '';

  if(days <= 182) return `<span class="access-badge soon">Expires in ${days<31?days+'d':Math.round(days/30)+'mo'}</span>`;
  return `<span class="access-badge ok">Valid</span>`;
}
