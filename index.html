/* ---------- Flights ---------- */
function flightStatusBadge(f){
  if(!f.status) return `<span class="access-badge member">Not checked</span>`;
  const s = f.status.toLowerCase();
  if(s.includes('cancel')) return `<span class="access-badge danger">${escapeHtml(f.status)}</span>`;
  if(s.includes('delay')) return `<span class="access-badge soon">${escapeHtml(f.status)}</span>`;
  if(s.includes('not found') || s.includes('failed') || s.includes('unknown')) return `<span class="access-badge member">${escapeHtml(f.status)}</span>`;
  return `<span class="access-badge ok">${escapeHtml(f.status)}</span>`;
}
function formatFlightTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return iso;
  return d.toLocaleString(undefined, {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
}
// Flags a flight whose scheduled departure follows the same person's
// previous flight's scheduled arrival by less than 90 minutes. Only works
// once "Check status" has been run on both legs, since that's the only
// place real scheduled times come from — the free-text dep/arr fields
// aren't structured enough to compare reliably.
function computeConnectionRisks(t){
  const risks = {};
  const byPerson = {};
  t.flights.forEach(f=>{
    const key = f.personId || '__group__';
    (byPerson[key] = byPerson[key] || []).push(f);
  });
  Object.values(byPerson).forEach(list=>{
    const sorted = [...list].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    for(let i=0;i<sorted.length-1;i++){
      const cur = sorted[i], next = sorted[i+1];
      const curArr = cur.statusDetail && cur.statusDetail.arrivalScheduled;
      const nextDep = next.statusDetail && next.statusDetail.departureScheduled;
      if(!curArr || !nextDep) continue;
      const diffMin = Math.round((new Date(nextDep).getTime() - new Date(curArr).getTime()) / 60000);
      if(!isNaN(diffMin) && diffMin >= 0 && diffMin < 90){
        risks[next.id] = diffMin;
      }
    }
  });
  return risks;
}
// Renders one flight as a compact card — used both for flights that land
// inside a matching itinerary day, and for the "Unscheduled flights" strip.
function renderFlightCard(t, f, risks){
  const RO = ADMIN ? '' : 'disabled';
  const d = f.statusDetail;
  const detailRows = [];
  if(d){
    if(d.departureTerminal || d.departureGate) detailRows.push(`Departure: ${[d.departureTerminal?'Terminal '+escapeHtml(d.departureTerminal):'', d.departureGate?'Gate '+escapeHtml(d.departureGate):''].filter(Boolean).join(', ')}`);
    if(d.departureScheduled) detailRows.push(`Scheduled departure: ${escapeHtml(formatFlightTime(d.departureScheduled))}`);
    if(d.arrivalTerminal || d.arrivalGate) detailRows.push(`Arrival: ${[d.arrivalTerminal?'Terminal '+escapeHtml(d.arrivalTerminal):'', d.arrivalGate?'Gate '+escapeHtml(d.arrivalGate):''].filter(Boolean).join(', ')}`);
    if(d.arrivalScheduled) detailRows.push(`Scheduled arrival: ${escapeHtml(formatFlightTime(d.arrivalScheduled))}`);
  }
  const risk = risks[f.id];
  return `
    <div class="doc-card flight-card" data-flight="${f.id}">
      <div class="doc-card-head">
        <div style="display:flex;align-items:center;gap:10px;"><span style="font-size:20px">✈️</span>
          <select class="flight-person" ${RO}>
            <option value="">— Whole group —</option>
            ${t.people.map(p=>`<option value="${p.id}" ${p.id===f.personId?'selected':''}>${escapeHtml(p.name||'Unnamed')}</option>`).join('')}
          </select>
        </div>
        ${flightStatusBadge(f)}
        ${ADMIN?'<button class="del flight-del" title="Remove flight">✕</button>':''}
      </div>
      <div class="doc-card-grid">
        <div class="doc-field"><label>Airline</label><input type="text" class="flight-airline" value="${escapeHtml(f.airline||'')}" placeholder="e.g. Qantas" ${RO}></div>
        <div class="doc-field"><label>Flight number</label><input type="text" class="flight-number" value="${escapeHtml(f.flightNumber||'')}" placeholder="e.g. QF430" ${RO} style="text-transform:uppercase"></div>
        <div class="doc-field"><label>Date</label><input type="date" class="flight-date" value="${escapeHtml(f.date||'')}" ${RO}></div>
        <div class="doc-field"><label>Booking ref</label><input type="text" class="flight-ref" value="${escapeHtml(f.bookingRef||'')}" placeholder="PNR" ${RO}></div>
        <div class="doc-field"><label>Departs</label><input type="text" class="flight-dep" value="${escapeHtml(f.depAirport||'')}" placeholder="e.g. BNE 6:30am" ${RO}></div>
        <div class="doc-field"><label>Arrives</label><input type="text" class="flight-arr" value="${escapeHtml(f.arrAirport||'')}" placeholder="e.g. SYD 8:00am" ${RO}></div>
      </div>
      ${detailRows.length ? `<div class="section-note" style="margin-top:8px;line-height:1.7">${detailRows.join('<br>')}</div>` : ''}
      ${risk!==undefined ? `<div style="margin-top:8px"><span class="access-badge danger">⚠️ Tight connection — only ${risk} min after previous flight</span></div>` : ''}
      <div style="margin-top:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <button class="btn ghost sm flight-check" data-flight-check="${f.id}">🔄 Check status</button>
        ${f.statusCheckedAt ? `<span class="section-note" style="margin:0">Last checked ${new Date(f.statusCheckedAt).toLocaleString()}</span>` : ''}
      </div>
    </div>
  `;
}

}
function formatDayDate(dateStr){

}

/* ---------- Itinerary ---------- */
function renderItinerary(t){
  const RO = ADMIN ? '' : 'disabled';

    return Object.entries(ACTIVITY_TYPES).map(([k,v])=>
      `<option value="${k}" ${k===selectedType?'selected':''}>${v.icon} ${v.label}</option>`
    ).join('');
  }
  // Every day's real calendar date, so flights can be matched to the day
  // they're on. Flights whose date doesn't match any day (or have no date
  // yet) fall into the "Unscheduled flights" strip instead of vanishing.
  const dayDates = t.days.map((d,i)=> t.startDate ? dayDateFor(t,i) : '');
  const matchedFlightIds = new Set();
  const dayGroups = t.days.map((d,i)=>{
    const acts = activitiesForDay(t, d.id);
    const dateStr = dayDates[i];
    const headerLabel = dateStr ? formatDayDateLong(dateStr) : d.label;
    let lastLocatedName = '';

    const dayFlights = dateStr ? t.flights.filter(f=>f.date===dateStr) : [];
    dayFlights.forEach(f=>matchedFlightIds.add(f.id));
    const flightCards = dayFlights.map(f=>renderFlightCard(t, f, risks)).join('');

    const rows = acts.map((a,idx)=>{
      const meta = ACTIVITY_TYPES[a.type] || ACTIVITY_TYPES.activity;

        ? (a.location.mapsUrl || ('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a.location.name)))

      const routeUrl = (a.location && a.location.name && lastLocatedName && lastLocatedName !== a.location.name)
        ? rome2rioUrl(lastLocatedName, a.location.name) : '';
      const routeOrigin = lastLocatedName;
      if(a.location && a.location.name) lastLocatedName = a.location.name;
      return `
      <div class="itin-row" data-activity="${a.id}">

            <span class="itin-icon-badge-emoji">${meta.icon}</span>
            <select class="activity-type itin-type-select" ${RO}>${typeOptionsFor(a.type)}</select>

        </div>
        <div class="itin-detail-col">
          <div class="itin-detail-top-row">
            <input type="text" class="activity-title itin-title-input" value="${escapeHtml(a.title||'')}" placeholder="e.g. Depart for the boat ramp" ${RO}>
            ${ADMIN?`
            <div class="activity-reorder">
              <button class="btn ghost sm activity-up" title="Move up" ${idx===0?'disabled':''}>▲</button>

            ${routeUrl ? `<a href="${escapeHtml(routeUrl)}" target="_blank" rel="noopener" class="activity-map-link activity-route-link" title="Getting there from ${escapeHtml(routeOrigin)} (Rome2Rio — flight/train/bus/car/ferry options)">🧭</a>` : ''}

    }).join('');
    return `
    <div class="itin-day-group" data-day="${d.id}">
      <div class="itin-date-header">${escapeHtml(headerLabel)}</div>
      ${flightCards ? `<div class="itin-flights-wrap" style="margin-bottom:10px">${flightCards}</div>` : ''}
      <div class="itin-rows-wrap">
        ${rows || `<div class="empty" style="padding:14px 0 14px 60px;font-size:12px;">Nothing planned yet.</div>`}
      </div>
      ${ADMIN?`<button class="btn ghost sm add-activity-btn" data-day-id="${d.id}" style="margin:6px 0 4px 60px">+ Add activity</button>`:''}
    </div>
  `;
  }).join('');

  const unscheduledFlights = t.flights.filter(f=>!matchedFlightIds.has(f.id));
  const unscheduledCards = unscheduledFlights.map(f=>renderFlightCard(t, f, risks)).join('');

  return `
    <div class="panel-page-title">🗓️ Itinerary</div>
    <div class="panel-section">
      <div class="section-head"><h2>✈️ Flights</h2>

      ${unscheduledCards || (t.flights.length
        ? `<div class="section-note" style="margin:0">All flights are matched to a day below.</div>`
        : `<div class="empty">
            <span class="empty-glyph">✈️</span>
            <div class="empty-title">No flights added yet</div>
            ${ADMIN
              ? `Add everyone\u2019s flights so the group can see delays at a glance.<button class="btn ghost sm" id="addFlightEmpty">+ Add first flight</button>`
              : `The trip admin hasn\u2019t added any flights yet.`}
          </div>`)}
    </div>
    <div class="panel-section">
      <div class="section-head"><h2>Day-by-day</h2></div>
      <div class="section-note">Your trip timeline — check-ins, launch times, anything time-based. Use ▲▼ to reorder within a day. Days are the same ones set up in Meal Plan.</div>
      <div class="itinerary-timeline">
        ${dayGroups || `<div class="empty">
          <span class="empty-glyph">🗓️</span>
          <div class="empty-title">No days set up yet</div>
          Itinerary days come from Meal Plan — <span class="empty-link jump-to-tab" data-tab="meals">set up your days there</span> first.
        </div>`}
      </div>
    </div>
  `;
}

/* ---------- Shopping List ---------- */
function renderShopping(t){
  const totals = shoppingTotals(t);
  const catList = [...new Set(t.shopping.map(i=>i.category).filter(Boolean))];
  const storeList = [...new Set(t.shopping.map(i=>i.store).filter(Boolean))];
  // Item-name autocomplete: curated common items, plus anything already
  // typed on this trip or any of this person's other trips — so the list
  // grows with actual use instead of staying static.
  const otherTripItems = Object.values(state.plansCache||{}).flatMap(tr=>(tr.shopping||[]).map(i=>i.item));
  const itemList = [...new Set([...COMMON_SHOPPING_ITEMS, ...otherTripItems, ...t.shopping.map(i=>i.item)].filter(Boolean))].sort();
  const colHeaders = `<th class="check-col"></th><th class="wide-col">Item</th><th>Store</th><th>Category</th><th class="num">Qty</th><th class="num">Budget</th><th class="num">Cost/Unit</th><th class="num">Actual</th><th></th>`;

  let body = '';
  if(!t.shopping.length){
    body = `<div class="empty">
      <span class="empty-glyph">🛒</span>
      <div class="empty-title">Your shopping list is empty</div>
      ${ADMIN
        ? `Food, alcohol, gear — group it by category or store as you go.<button class="btn ghost sm" id="addItemEmpty">+ Add first item</button>`
        : `The trip admin hasn\u2019t added any items yet.`}
    </div>`;
  } else if(state.shoppingView==='category'){
    const groups = groupShopping(t,'category');
    groups.forEach(gr=>{
      const groupKey = escapeHtml(gr.label);
      body += `<table style="margin-bottom:18px"><tbody>
        <tr class="group-head"><td colspan="9">
          <div class="group-head-row">
            <span>${groupKey}</span>
            ${ADMIN?`<button class="btn ghost sm group-add-btn" data-add-category="${groupKey}">+ Add</button>`:''}
          </div>
        </td></tr>
        <tr>${colHeaders}</tr>
        ${gr.items.map(itemRow).join('')}
        <tr class="subtotal"><td colspan="5">Subtotal</td><td class="num" data-label="Budget">${money2(gr.budget)}</td><td></td><td class="num" data-label="Actual">${money2(gr.actual)}</td><td></td></tr>
      </tbody></table>`;
    });
  } else {
    const groups = groupShopping(t,'store');
    groups.forEach(gr=>{
      const groupKey = escapeHtml(gr.label);
      body += `<table style="margin-bottom:18px"><tbody>
        <tr class="group-head"><td colspan="9">
          <div class="group-head-row">
            <span>${groupKey}</span>
            ${ADMIN?`<button class="btn ghost sm group-add-btn" data-add-store="${groupKey}">+ Add</button>`:''}
          </div>
        </td></tr>
        <tr>${colHeaders}</tr>
        ${gr.items.map(itemRow).join('')}
        <tr class="subtotal"><td colspan="5">Subtotal</td><td class="num" data-label="Budget">${money2(gr.budget)}</td><td></td><td class="num" data-label="Actual">${money2(gr.actual)}</td><td></td></tr>
      </tbody></table>`;
    });
  }

  return `
    <div class="panel-section">
      <div class="section-head">
        <h2>🛒 Shopping List</h2>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <div class="toggle-group">
            <button data-view="category" class="${state.shoppingView==='category'?'active':''}">By Category</button>
            <button data-view="store" class="${state.shoppingView==='store'?'active':''}">By Store</button>
          </div>
          ${ADMIN?'<button class="btn ghost sm" id="addItem">+ Add uncategorised item</button>':''}
        </div>
      </div>
      <div class="section-note">Tick items off as you buy them. Spot something in the wrong group? Change its Store or Category right in the row and it'll move there automatically.</div>
      <div class="scroll-hint">↔ Swipe inside the table to see all columns</div>
      <div class="table-scroll">
      ${body}
      <table><tbody>
        <tr class="grandtotal"><td colspan="5">Grand Total</td><td class="num" data-label="Budget">${money2(totals.budget)}</td><td></td><td class="num" data-label="Actual">${money2(totals.actual)}</td><td></td></tr>
      </tbody></table>
      </div>
      <datalist id="catList">${catList.map(c=>`<option value="${escapeHtml(c)}">`).join('')}</datalist>
      <datalist id="storeList">${storeList.map(s=>`<option value="${escapeHtml(s)}">`).join('')}</datalist>
      <datalist id="itemList">${itemList.map(i=>`<option value="${escapeHtml(i)}">`).join('')}</datalist>
    </div>
  `;
}

function itemRow(item){
  const RO = ADMIN ? '' : 'disabled';
  const lineActual = (Number(item.qty)||0) * (Number(item.unitActual)||0);
  return `<tr data-item="${item.id}" class="${item.purchased?'purchased-row':''}">
    <td class="check-col" data-label=""><input type="checkbox" class="item-purchased" ${item.purchased?'checked':''} title="Purchased" ${RO}></td>
    <td class="wide-col" data-label="Item"><input type="text" class="item-name" list="itemList" value="${escapeHtml(item.item)}" placeholder="Item" ${RO}></td>
    <td data-label="Store"><input type="text" class="item-store" list="storeList" value="${escapeHtml(item.store||'')}" placeholder="Store" ${RO}></td>
    <td data-label="Category"><input type="text" class="item-category" list="catList" value="${escapeHtml(item.category||'')}" placeholder="Category" ${RO}></td>
    <td class="num" data-label="Qty"><input type="number" class="item-qty" value="${item.qty??1}" ${RO}></td>
    <td class="num" data-label="Budget">${moneyField('item-budget', item.budget||0, RO)}</td>
    <td class="num" data-label="Cost/Unit">${moneyField('item-unit', item.unitActual||0, `step="0.01" title="Cost per unit" ${RO}`)}</td>
    <td class="num" data-label="Actual"><span class="computed-actual">${money2(lineActual)}</span></td>
    <td class="row-actions">${ADMIN?'<button class="del item-del" title="Remove">✕</button>':''}</td>
  </tr>`;
}

    const dropdown = el.parentElement.querySelector('.place-suggestions');

    el.addEventListener('input', e=>{
      const a = findActivity(t, rowId(e,'activity'));
      if(!a.location) a.location = {name:'', mapsUrl:''};
      a.location.name = e.target.value;
      a.location.mapsUrl = ''; // clear any stale custom link — re-derived from the name unless a suggestion is picked below
      scheduleSave();

      clearTimeout(el._placeSearchTimer);
      const query = e.target.value.trim();
      if(query.length < 3){ closeDropdown(); return; }
      el._placeSearchTimer = setTimeout(async ()=>{
        const results = await searchPlacesNominatim(query);
        if(results === null) return; // aborted — a newer search is already in flight
        if(!dropdown || el.value.trim() !== query) return; // stale by the time results came back
        if(!results.length){ closeDropdown(); return; }
        dropdown.innerHTML = results.map((r,i)=>`<div class="place-suggestion-item" data-idx="${i}">${escapeHtml(r.name)}</div>`).join('');
        dropdown.hidden = false;
        dropdown.querySelectorAll('.place-suggestion-item').forEach((item,i)=>{
          item.addEventListener('mousedown', ev=>{ // mousedown fires before the input's blur, so the click isn't lost
            ev.preventDefault();
            const chosen = results[i];
            el.value = chosen.name;
            a.location.name = chosen.name;
            a.location.mapsUrl = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(chosen.lat + ',' + chosen.lon);
            closeDropdown();
            scheduleSave();
            renderPanel(); // refresh the map-link icon now that we have a precise location
          });
        });
      }, 450); // debounced — Nominatim's free tier asks for at most ~1 request/sec
    });
    el.addEventListener('blur', ()=>{ setTimeout(closeDropdown, 150); }); // slight delay so a suggestion click still registers
    el.addEventListener('change', ()=>renderPanel()); // refresh the map-link icon
  });
  qa('.activity-notes').forEach(el=>el.addEventListener('input', e=>{
    findActivity(t, rowId(e,'activity')).notes = e.target.value; scheduleSave();
  }));
  qa('.activity-del').forEach(el=>el.addEventListener('click', e=>{
    const idv = rowId(e,'activity'); t.activities = t.activities.filter(a=>a.id!==idv); scheduleSave(); renderPanel();
  }));
  qa('.activity-up').forEach(el=>el.addEventListener('click', e=>{
    moveActivity(t, rowId(e,'activity'), -1); scheduleSave(); renderPanel();
  }));
  qa('.activity-down').forEach(el=>el.addEventListener('click', e=>{

function bindIdentityGate(){
  stopVerifyPolling(); // safety net — in case we land here with a leftover poll from the verify gate
  const statusEl = document.getElementById('authStatus');
  const setStatus = (msg, isError)=>{ statusEl.textContent = msg; statusEl.style.color = isError ? 'var(--danger)' : 'var(--ink-soft)'; };

  const pwToggle = document.getElementById('authPasswordToggle');
  if(pwToggle) pwToggle.addEventListener('click', ()=>{

    pwToggle.textContent = showing ? '👁️' : '🙈';
  });

  document.getElementById('authToggleMode').addEventListener('click', (e)=>{
    e.preventDefault();

  });

  if(forgotLink) forgotLink.addEventListener('click', async (e)=>{

    setStatus('Sending reset email…', false);
    forgotLink.style.pointerEvents = 'none';

      await withTimeout(sendPasswordResetEmail(auth, email), 'Sending reset email');
      setStatus('✓ Reset link sent to '+email+' — check your inbox (and spam folder).', false);
    }catch(e){
      setStatus(authErrorMessage(e), true);
    }finally{
      forgotLink.style.pointerEvents = '';
    }
  });

  document.getElementById('authSubmit').addEventListener('click', async ()=>{
    const isSignup = state.authMode === 'signup';
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    const nameField = document.getElementById('authName');
    const name = nameField ? nameField.value.trim() : '';
    if(isSignup && !name){ nameField.focus(); return; }
    if(!email){ document.getElementById('authEmail').focus(); return; }
    if(!password){ document.getElementById('authPassword').focus(); return; }

    const btn = document.getElementById('authSubmit');
    btn.disabled = true;
    setStatus(isSignup ? 'Creating your account…' : 'Signing in…', false);
    try{
      if(isSignup){
        const cred = await withTimeout(createUserWithEmailAndPassword(auth, email, password), 'Creating account');
        await withTimeout(updateProfile(cred.user, {displayName: name}), 'Saving name');
        await withTimeout(sendEmailVerification(cred.user, verificationActionCodeSettings()), 'Sending verification email');

      }
    }catch(e){
      setStatus(authErrorMessage(e), true);
      btn.disabled = false;
    }
  });
}

// Firebase's raw error codes aren't something to show someone mid-signup —
// map the common ones to plain language, fall back to the raw message for
// anything unexpected rather than silently swallowing it.
function authErrorMessage(e){
  const map = {
    'auth/email-already-in-use': 'That email already has an account — try signing in instead.',
    'auth/invalid-email': 'That doesn\u2019t look like a valid email address.',
    'auth/weak-password': 'Password needs to be at least 6 characters.',
    'auth/invalid-credential': 'Email or password is incorrect.',
    'auth/wrong-password': 'Email or password is incorrect.',
    'auth/user-not-found': 'No account found for that email — check for a typo, or create an account.',
    'auth/too-many-requests': 'Too many attempts — wait a bit before trying again.',
  };
  return map[e.code] || String(e.message || e);
}

// Auto-poll handle for the verify-email gate — module-level so it can be torn
// down from anywhere (a fresh render of this same gate, leaving it via sign
// out, or successfully verifying) without leaking a timer or a stale listener.
let verifyPollTimer = null;
let verifyVisibilityHandler = null;
function stopVerifyPolling(){
  if(verifyPollTimer){ clearInterval(verifyPollTimer); verifyPollTimer = null; }
  if(verifyVisibilityHandler){ document.removeEventListener('visibilitychange', verifyVisibilityHandler); verifyVisibilityHandler = null; }
}
function bindVerifyEmailGate(){
  stopVerifyPolling(); // in case this gate is being re-bound (e.g. after "Resend")
  const statusEl = document.getElementById('verifyStatus');
  const setStatus = (msg, isError)=>{ statusEl.textContent = msg; statusEl.style.color = isError ? 'var(--danger)' : 'var(--ink-soft)'; };

  // silent=true: used by the background poll and the tab-refocus check —
  // those shouldn't show "still not verified" errors on every failed check,
  // only the explicit button click should.
  async function checkVerified(silent){
    try{
      await reload(auth.currentUser);
      if(auth.currentUser && auth.currentUser.emailVerified){
        stopVerifyPolling();
        await handleAuthStateChange(auth.currentUser);
        return true;
      }
    }catch(e){
      if(!silent) setStatus(authErrorMessage(e), true);
    }
    return false;
  }

  // Checks every few seconds so verifying on a phone (or in another tab)
  // moves the app forward on its own — no need to remember to come back and
  // click the button. Also re-checks immediately whenever this tab regains
  // focus, which is the common case (verify in the email app, switch back).
  verifyPollTimer = setInterval(()=>checkVerified(true), 4000);
  verifyVisibilityHandler = ()=>{ if(document.visibilityState === 'visible') checkVerified(true); };
  document.addEventListener('visibilitychange', verifyVisibilityHandler);

  document.getElementById('verifyCheckAgain').addEventListener('click', async ()=>{
    const btn = document.getElementById('verifyCheckAgain');
    btn.disabled = true;
    setStatus('Checking…', false);
    const verified = await checkVerified(false);
    if(!verified){
      setStatus('Still not verified — click the link in the email first, then try again.', true);
      btn.disabled = false;
    }
  });
  document.getElementById('verifyResend').addEventListener('click', async (e)=>{
    e.preventDefault();
    try{
      await withTimeout(sendEmailVerification(auth.currentUser, verificationActionCodeSettings()), 'Sending verification email');
      setStatus('Sent — check your inbox (and spam folder).', false);
    }catch(e){
      setStatus(authErrorMessage(e), true);
    }
  });
  document.getElementById('verifySignOut').addEventListener('click', async (e)=>{
    e.preventDefault();
    stopVerifyPolling();
    await clearIdentity();
  });
}

/* ============================= One-time migration from the old backend ============================= */
// Talks to the OLD Apps Script Web App using its original GET protocol —
// completely separate from storeGet/storeSet, which now point at Firestore.
// This exists purely to pull old data across once; nothing else in the app
// calls this.
const LEGACY_TIMEOUT_MS = 20000;
async function legacyBackendGet(baseUrl, key){
  try{
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), LEGACY_TIMEOUT_MS);
    const res = await fetch(baseUrl + '?action=get&key=' + encodeURIComponent(key), {method:'GET', signal:controller.signal})
      .finally(()=>clearTimeout(timer));
    const data = await res.json();
    if(!data.ok) return {ok:false, error: data.error||'unknown'};
    const value = (data.value===null || data.value===undefined || data.value==='') ? null : JSON.parse(data.value);
    return {ok:true, value};
  }catch(e){
    return {ok:false, error: e.name==='AbortError' ? 'timed out' : String(e && e.message || e)};
  }
}

        </div>
        <div class="modal-actions">
          <button class="btn ghost sm" id="cancelMigrate">Close</button>
          <button class="btn" id="confirmMigrate">Migrate now</button>

function bindMigrateModal(){
  const backdrop = document.getElementById('migrateBackdrop');
  let didMigrate = false;
  const close = ()=>{ state.showMigrateModal=false; if(didMigrate){ loadTripsAndTrip(); } else { render(); } };
  document.getElementById('cancelMigrate').addEventListener('click', close);
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) close(); });

  document.getElementById('confirmMigrate').addEventListener('click', async ()=>{
    const url = document.getElementById('migrateUrlInput').value.trim();
    const statusEl = document.getElementById('migrateStatus');
    const btn = document.getElementById('confirmMigrate');
    if(!url){ statusEl.textContent = 'Paste the old backend URL first.'; statusEl.style.color = 'var(--danger)'; return; }
    btn.disabled = true;
    statusEl.style.color = 'var(--ink-soft)';
    statusEl.textContent = 'Fetching trip list from the old backend…';

    const idxResult = await legacyBackendGet(url, 'trips-index');
    if(!idxResult.ok){
      statusEl.textContent = 'Couldn\u2019t reach the old backend (' + idxResult.error + '). Double-check the URL and that the deployment is still live.';
      statusEl.style.color = 'var(--danger)';
      btn.disabled = false;
      return;
    }
    const oldIndex = idxResult.value || [];
    if(!oldIndex.length){
      statusEl.textContent = 'Connected, but the old backend has no trips-index — nothing to migrate.';
      btn.disabled = false;
      return;
    }

    // Only migrate trips not already present in Firestore, by id — safe to
    // re-run this without duplicating or overwriting anything already here.
    const currentIndex = (await storeGet('trips-index', true)) || [];
    const currentIds = new Set(currentIndex.map(ix=>ix.id));
    const toMigrate = oldIndex.filter(ix=>!currentIds.has(ix.id));

    const migratedNames = [];
    const failed = [];
    for(let i=0;i<toMigrate.length;i++){
      const ix = toMigrate[i];
      statusEl.textContent = `Migrating trip ${i+1} of ${toMigrate.length}: "${ix.name}"…`;
      const tripResult = await legacyBackendGet(url, 'trip:'+ix.id);
      if(!tripResult.ok || !tripResult.value){ failed.push(ix.name+' ('+(tripResult.error||'empty')+')'); continue; }
      const trip = ensureTripShape(tripResult.value);
      const ok = await storeSet('trip:'+trip.id, trip, true);
      if(ok){ migratedNames.push(trip.name); } else { failed.push(trip.name+' (write failed)'); }
    }

    // Rebuild the index from whatever's now actually in Firestore, rather
    // than just appending — avoids ever drifting out of sync with reality.
    const newIndexEntries = toMigrate
      .filter(ix=>migratedNames.includes(ix.name))
      .map(ix=>({id:ix.id, name:ix.name, type:ix.type, createdAt:ix.createdAt}));
    await storeSet('trips-index', [...currentIndex, ...newIndexEntries], true);

    // User directory: merge by name, case-insensitive — keep any entry
    // already in Firestore, only add old ones that aren't already present.
    statusEl.textContent = 'Merging the user directory…';
    const dirResult = await legacyBackendGet(url, 'user-directory');
    if(dirResult.ok && Array.isArray(dirResult.value)){
      const currentDir = (await storeGet('user-directory', true)) || [];
      const currentNames = new Set(currentDir.map(u=>String(u.name||'').trim().toLowerCase()));
      const newPeople = dirResult.value.filter(u=>!currentNames.has(String(u.name||'').trim().toLowerCase()));
      if(newPeople.length){
        await storeSet('user-directory', [...currentDir, ...newPeople], true);
      }
    }

    state.tripsIndex = []; // force a real reload from Firestore next time My Plans loads, not a stale cache
    didMigrate = true;
    let summary = `Done. Migrated ${migratedNames.length} trip${migratedNames.length===1?'':'s'}`;
    if(migratedNames.length) summary += ':\n' + migratedNames.map(n=>'• '+n).join('\n');
    if(failed.length) summary += `\n\n${failed.length} failed:\n` + failed.map(n=>'• '+n).join('\n');
    if(!toMigrate.length) summary = 'Everything from the old backend is already in Firestore — nothing new to migrate.';
    statusEl.textContent = summary + '\n\n(Click Close to return to My Plans with the migrated trips visible.)';
    statusEl.style.color = failed.length ? 'var(--danger)' : 'var(--pine-deep)';
    btn.disabled = false;
  });
}

          <button class="btn" id="confirmImport">Import</button>
        </div>
      </div>
    </div>
  `;
}

function bindImportModal(t){
  const close = ()=>{ state.showImportModal=false; render(); };
  document.getElementById('cancelImport').addEventListener('click', close);
  const backdrop = document.getElementById('importBackdrop');
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) close(); });
  document.getElementById('confirmImport').addEventListener('click', ()=>{
    const msg = document.getElementById('importMsg');
    let data;
    try{
      data = JSON.parse(document.getElementById('importText').value);
    }catch(e){
      msg.textContent = 'That\u2019s not valid JSON \u2014 check for a missing bracket or comma.';
      msg.style.color = 'var(--danger)';
      return;
    }
    try{
      applyImport(t, data);
      touchIndex();
      state.showImportModal = false;
      scheduleSave();
      render();
    }catch(e){
      msg.textContent = 'Import failed: ' + e.message;
      msg.style.color = 'var(--danger)';
    }
  });
}

/* ============================= Manage Access (Developer only) ============================= */
function renderManageAccessModal(){
  const GLOBAL_LEVELS = {developer: ACCESS_LEVELS.developer, member: ACCESS_LEVELS.member};
  const levelSelect = (u)=>`
    <select class="access-level-select">
      ${Object.entries(GLOBAL_LEVELS).map(([k,v])=>`<option value="${k}" ${u.level===k?'selected':''}>${v.label}</option>`).join('')}
    </select>
  `;
  const rows = state.userDirectory.map((u,i)=>`
    <tr data-access-index="${i}">
      <td class="wide-col"><input type="text" class="access-name" value="${escapeHtml(u.name)}" placeholder="Full name"></td>
      <td>${levelSelect(u)}</td>
      <td class="row-actions"><button class="del access-del" title="Remove access">✕</button></td>
    </tr>
  `).join('');

  return `
    <div class="modal-backdrop" id="manageAccessBackdrop">
      <div class="modal" style="max-width:560px">
        <h2>👑 Manage Access</h2>
        <div class="section-note" style="margin-bottom:14px">
          This list is only for <b>Developer</b> access — who can manage this list. A Developer has no automatic
          trip access; editing a trip requires being personally added to it, same as anyone. Everyone else is a
          <b>Member</b> by default. Trip Admin is separate and per-trip: whoever creates a trip becomes its admin
          automatically, and can promote others within that trip's People tab.
        </div>
        <table>
          <thead><tr><th class="wide-col">Name</th><th>Level</th><th></th></tr></thead>
          <tbody id="accessRows">${rows}</tbody>
        </table>
        <button class="btn ghost sm" id="addAccessRow" style="margin-top:10px">+ Add person</button>
        <div id="accessMsg" class="section-note" style="margin-top:10px"></div>

        <div class="maintenance-toggle-box">
          <div>
            <div class="maintenance-toggle-title">🔧 Maintenance Mode</div>
            <div class="section-note" style="margin:2px 0 0">
              Temporary, visible-everywhere access to every trip's data for fixing issues — off by default each
              session. Turn it off again when you're done.
            </div>
          </div>
          <label class="maintenance-switch">
            <input type="checkbox" id="maintenanceModeToggle" ${state.developerMaintenanceMode?'checked':''}>
            <span class="maintenance-switch-track"></span>
          </label>
        </div>

        <div class="modal-actions">
          <button class="btn" id="closeManageAccess">Done</button>
        </div>
      </div>
    </div>
  `;
}

function bindManageAccessModal(){
  const close = ()=>{ state.showManageAccessModal=false; render(); };
  const msgEl = document.getElementById('accessMsg');
  function showMsg(text, isError){
    msgEl.textContent = text;
    msgEl.style.color = isError ? 'var(--danger)' : 'var(--ink-soft)';
  }

  document.getElementById('closeManageAccess').addEventListener('click', close);
  const backdrop = document.getElementById('manageAccessBackdrop');
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) close(); });

  document.querySelectorAll('#accessRows .access-name').forEach(el=>{
    el.addEventListener('input', e=>{
      const i = e.target.closest('[data-access-index]').dataset.accessIndex;
      state.userDirectory[i].name = e.target.value;
      saveUserDirectory();
    });
  });
  document.querySelectorAll('#accessRows .access-level-select').forEach(el=>{
    el.addEventListener('change', e=>{
      const i = e.target.closest('[data-access-index]').dataset.accessIndex;
      const entry = state.userDirectory[i];
      const newLevel = e.target.value;
      if(entry.level==='developer' && newLevel!=='developer' && countDevelopers()<=1){
        showMsg('Can\u2019t demote the last Developer — promote someone else first.', true);
        e.target.value = 'developer';
        return;
      }
      const wasDeveloper = entry.level==='developer';
      entry.level = newLevel;
      saveUserDirectory();
      if(wasDeveloper && newLevel!=='developer' && entry.uid){
        revokeDeveloperUid(entry.uid); // closes the actual database-level access, not just the label
      } else if(!wasDeveloper && newLevel==='developer' && entry.uid){
        grantDeveloperUid(entry.uid); // takes effect immediately, not just on their next login
      }
      showMsg('Saved.', false);
      // If the person being changed is ME, my own access updates live.
      if(state.identity && entry.name.trim().toLowerCase()===state.identity.name.trim().toLowerCase()){
        computeGlobalLevel();
      }
    });
  });
  document.querySelectorAll('#accessRows .access-del').forEach(el=>{
    el.addEventListener('click', e=>{
      const i = e.target.closest('[data-access-index]').dataset.accessIndex;
      const entry = state.userDirectory[i];
      if(entry.level==='developer' && countDevelopers()<=1){
        showMsg('Can\u2019t remove the last Developer — promote someone else first.', true);
        return;
      }
      const wasDeveloperUid = entry.level==='developer' ? entry.uid : null;
      state.userDirectory.splice(i,1);
      saveUserDirectory();
      if(wasDeveloperUid) revokeDeveloperUid(wasDeveloperUid);
      state.showManageAccessModal = true; // stay open
      render();
    });
  });
  document.getElementById('addAccessRow').addEventListener('click', ()=>{
    state.userDirectory.push({name:'', level:'member'});
    saveUserDirectory();
    render();
  });
  const maintToggle = document.getElementById('maintenanceModeToggle');
  if(maintToggle) maintToggle.addEventListener('change', e=>{
    state.developerMaintenanceMode = e.target.checked;
    loadTripsAndTrip(); // re-fetch so the new visibility rule applies immediately, modal stays open throughout
  });
}

/* ============================= Invite (QR code / link) ============================= */
function buildInviteUrl(tripId){
  const base = window.location.origin + window.location.pathname;
  return tripId ? (base + '?t=' + encodeURIComponent(tripId)) : base;
}
function renderInviteModal(){
  const tripId = state.inviteForTripId || null;
  const trip = tripId ? state.plansCache[tripId] : null;
  const url = buildInviteUrl(tripId);
  return `
    <div class="modal-backdrop" id="inviteBackdrop">
      <div class="modal" style="max-width:420px; text-align:center">
        <h2>📱 ${trip ? `Invite to "${escapeHtml(trip.name)}"` : 'Invite a member'}</h2>
        <div class="section-note" style="margin-bottom:14px">
          Scan this with a phone camera, or share the link below in a text or WhatsApp message.
          ${trip
            ? 'It opens the app and, once they create an account (or sign in) and verify their email, adds them straight into this trip.'
            : 'It opens the app for them to create an account or sign in. This general link doesn\u2019t add them to any specific trip; from a trip\u2019s People tab you can invite straight into that trip instead.'}
        </div>
        <div id="inviteQr" style="display:flex; justify-content:center; margin:14px 0;"></div>
        <div class="field">
          <label>Or copy this link</label>
          <input type="text" id="inviteLinkText" readonly value="${escapeHtml(url)}" style="width:100%; border:1px solid var(--line); border-radius:4px; padding:8px; font-family:'IBM Plex Mono',monospace; font-size:11px; text-align:center;">
        </div>
        <div id="inviteCopyMsg" class="section-note"></div>
        <div class="modal-actions" style="justify-content:center">
          <button class="btn ghost sm" id="copyInviteLink">📋 Copy link</button>
          <button class="btn" id="closeInvite">Done</button>
        </div>
      </div>
    </div>
  `;
}
function bindInviteModal(){
  const close = ()=>{ state.showInviteModal=false; render(); };
  document.getElementById('closeInvite').addEventListener('click', close);
  const backdrop = document.getElementById('inviteBackdrop');
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) close(); });

  // qrcode-generator auto-picks a type/version; -1 lets it choose the
  // smallest one that fits this URL, 'M' balances scan-reliability and size.
  try{
    const qr = qrcode(-1, 'M');
    qr.addData(buildInviteUrl(state.inviteForTripId));
    qr.make();
    document.getElementById('inviteQr').innerHTML = qr.createSvgTag({scalable:true});
    const svg = document.getElementById('inviteQr').querySelector('svg');
    if(svg){ svg.style.width='220px'; svg.style.height='220px'; }
  }catch(e){
    document.getElementById('inviteQr').innerHTML = '<div class="empty">Couldn\u2019t generate a QR code \u2014 use the link below instead.</div>';
  }

  document.getElementById('copyInviteLink').addEventListener('click', async ()=>{
    const input = document.getElementById('inviteLinkText');
    const msg = document.getElementById('inviteCopyMsg');
    try{
      await navigator.clipboard.writeText(input.value);
      msg.textContent = 'Copied!';
    }catch(e){
      input.select();
      msg.textContent = 'Link selected \u2014 copy it manually (Ctrl/Cmd+C).';
    }
  });
}

function applyImport(t, data){
  if(data.name) t.name = String(data.name);
  if(data.type && TYPE_META[data.type]) t.type = data.type;
  if(data.currency && CURRENCIES[String(data.currency).toUpperCase()]) t.currency = String(data.currency).toUpperCase();
  if(data.startDate !== undefined) t.startDate = String(data.startDate||'');
  if(data.catchLogEnabled !== undefined) t.catchLogEnabled = !!data.catchLogEnabled;
  if(data.costsEnabled !== undefined) t.costsEnabled = !!data.costsEnabled;
  if(data.location){
    t.location = {name: data.location.name||'', mapsUrl: data.location.mapsUrl||''};
  }
  if(Array.isArray(data.costs)){
    t.costs = data.costs.map(c=>({id:uid(), label:c.label||'', budget:Number(c.budget)||0, actual:Number(c.actual)||0}));
  }
  const roleIdByLabel = {};
  if(Array.isArray(data.roles)){
    t.roles = data.roles.map(r=>{
      const id = uid();
      roleIdByLabel[r.label] = id;
      return {id, label:r.label||'', amount:Number(r.amount)||0};
    });
  }
  if(Array.isArray(data.people)){
    // Preserve trip-admin status for anyone who already had it, matched by
    // name — otherwise importing (which fully replaces the People list)
    // would silently strip admin rights from whoever just set the trip up,
    // locking them out of their own trip immediately after import.
    const priorAdminNames = new Set(t.people.filter(p=>p.isTripAdmin).map(p=>String(p.name||'').trim().toLowerCase()));
    t.people = data.people.map(p=>({
      id: uid(),
      name: p.name||'',
      phone: p.phone||'',
      roleId: roleIdByLabel[p.roleLabel] || (t.roles[0] && t.roles[0].id) || '',
      paid: Number(p.paid)||0,
      isTripAdmin: priorAdminNames.has(String(p.name||'').trim().toLowerCase()),
    }));
    // Safety net: if the import didn't include anyone who was previously
    // admin (e.g. names didn't match), make sure whoever is doing the
    // import right now still ends up with access to their own trip.
    if(state.identity && !t.people.some(p=>p.isTripAdmin)){
      const myName = String(state.identity.name||'').trim().toLowerCase();
      const me = t.people.find(p=>String(p.name||'').trim().toLowerCase()===myName);
      if(me){
        me.isTripAdmin = true;
      } else {
        t.people.push({id:uid(), name:state.identity.name, phone:state.identity.phone||'', roleId:(t.roles[0]&&t.roles[0].id)||'', paid:0, isTripAdmin:true});
      }
    }
  }
  if(Array.isArray(data.days)){
    t.days = data.days.map(d=>({id:uid(), label:d.label||'', breakfast:d.breakfast||'', lunch:d.lunch||'', dinner:d.dinner||''}));
  }
  if(Array.isArray(data.activities)){
    t.activities = data.activities
      .filter(a=>t.days[a.dayIndex])
      .map((a,i)=>({
        id: uid(),
        dayId: t.days[a.dayIndex].id,
        type: a.type || 'activity',
        time: a.time||'',
        endTime: a.endTime||'',
        title: a.title||'',
        location: {name: (a.location&&a.location.name)||'', mapsUrl: (a.location&&a.location.mapsUrl)||''},
        notes: a.notes||'',
        order: a.order===undefined ? i : a.order,
      }));
  }
  if(Array.isArray(data.shopping)){
    t.shopping = data.shopping.map(s=>({
      id: uid(),
      item: s.item||'',
      category: s.category||'',
      store: s.store||'',
      qty: s.qty===undefined ? 1 : Number(s.qty),
      budget: Number(s.budget)||0,
      unitActual: Number(s.unitActual)||0,
      purchased: !!s.purchased,
    }));
  }
}

init();
</script>
